      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: 0.29.0.001
      AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENTERPRISE_SOURCE_STUBS_URL: http://dts-airbyte-server:8001/api/v1/enterprise-source-stubs
