      - ./services/dts-platform/drivers:${STACK_ROOT}/services/dts-platform/drivers:ro,z
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dts-core"
      - "traefik.http.routers.dts-airflow.rule=Host(`${HOST_FLOW}`)"
      - "traefik.http.routers.dts-airflow.entrypoints=websecure"
