      - "traefik.http.services.dts-airflow.loadbalancer.server.port=8080"
      - "traefik.http.routers.dts-airflow.middlewares=platform-forward-auth@file,security-headers@file"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1" ]
      interval: 10s
