        condition: service_started
      dts-airbyte-k8s-mock:
        condition: service_started
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-1.8.2}
      AB_AUTH_SECRET_CREATION_ENABLED: "false"
      KUBERNETES_MASTER: http://dts-airbyte-k8s-mock:8000
      KUBERNETES_TRUST_CERTIFICATES: "true"
      DATABASE_HOST: ${PG_HOST}
      DATABASE_PORT: ${PG_PORT}
      DATABASE_DB: ${PG_DB_AIRBYTE}
      DATABASE_USER: ${PG_USER_AIRBYTE}
      DATABASE_PASSWORD: ${PG_PWD_AIRBYTE}
      DATABASE_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_USERNAME: ${PG_USER_AIRBYTE}
      DATASOURCES_LOCAL_PASSWORD: ${PG_PWD_AIRBYTE}
      DATASOURCES_LOCAL_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASOURCES_LOCAL_SECRETS_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_USERNAME: ${PG_USER_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_PASSWORD: ${PG_PWD_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_DRIVER_CLASS_NAME: org.postgresql.Driver
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-default}
      KUBERNETES_IN_CLUSTER: "false"
      CONFIG_ROOT: /data/airbyte/config
      WORKSPACE_ROOT: /data/airbyte/workspace
      JAVA_TOOL_OPTIONS: "-Ddatasources.local-secrets.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE} -Ddatasources.local-secrets.username=${PG_USER_AIRBYTE} -Ddatasources.local-secrets.password=${PG_PWD_AIRBYTE} -Ddatasources.local-secrets.driver-class-name=org.postgresql.Driver"
      LOCAL_ROOT: /data/airbyte/local
      LOCAL_DOCKER_MOUNT: /data/airbyte/local
      STORAGE_TYPE: local
      AIRBYTE_CLOUD_STORAGE_BUCKET_LOG: log
      AIRBYTE_CLOUD_STORAGE_BUCKET_STATE: state
      AIRBYTE_CLOUD_STORAGE_BUCKET_WORKLOAD_OUTPUT: workload_output
      AIRBYTE_CLOUD_STORAGE_BUCKET_ACTIVITY_PAYLOAD: activity_payload
      AIRBYTE_CLOUD_STORAGE_BUCKET_AUDIT_LOGGING: audit_logging
      AIRBYTE_CLOUD_STORAGE_BUCKET_PROFILER_OUTPUT: profiler_output
      INTERNAL_API_HOST: dts-airbyte-server
      INTERNAL_API_PORT: 8001
      AIRBYTE_INTERNAL_API_BASE_PATH: http://dts-airbyte-server:8001/api/v1
      AIRBYTE_INTERNAL_API_WORKLOAD_API_HOST: http://dts-airbyte-server:8001
      AIRBYTE_INTERNAL_API_CONNECTOR_BUILDER_API_HOST: http://dts-airbyte-server:8001
      AIRBYTE_WORKLOAD_API_BASE_PATH: http://dts-airbyte-server:8001/api/v1/workload/
      TEMPORAL_HOST: dts-airbyte-temporal:7233
      WORKER_ENVIRONMENT: DOCKER
      MICRONAUT_ENVIRONMENTS: control-plane
    volumes:
      - ./services/dts-airbyte/config:/data/airbyte/config
      - ./services/dts-airbyte/workspace:/data/airbyte/workspace
      - ./services/dts-airbyte/local:/data/airbyte/local
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - dts-core

  dts-airbyte-webapp:
    platform: linux/arm64
    image: ${IMAGE_AIRBYTE_WEBAPP:-airbyte/webapp:1.8.2}
    container_name: dts-airbyte-webapp
    depends_on:
      dts-airbyte-server:
        condition: service_started
    environment:
      AIRBYTE_API_URL: "http://${HOST_GATEWAY_IP:-127.0.0.1}:${AIRBYTE_SERVER_PORT:-18021}"
      REACT_APP_API_URL: "http://${HOST_GATEWAY_IP:-127.0.0.1}:${AIRBYTE_SERVER_PORT:-18021}"
      AIRBYTE_SERVER_HOST: dts-airbyte-server
      AIRBYTE_SERVER_PORT: 8001
      CONNECTOR_BUILDER_API_HOST: dts-airbyte-server
      KEYCLOAK_INTERNAL_HOST: dts-keycloak:8080
    ports:
      - "${AIRBYTE_WEBAPP_PORT:-18020}:80"
    restart: unless-stopped
    networks:
      - dts-core

  dts-dbt:
    image: ${IMAGE_DBT:-dbt-core:1.11.2}
    container_name: dts-dbt
    entrypoint: /bin/bash
    command: ["-lc", "sleep infinity"]
    working_dir: /opt/dbt
    volumes:
      - ./services/dts-dbt:/opt/dbt
      - ./services/dts-dbt/profiles:/root/.dbt
    restart: unless-stopped
    networks:
      - dts-core


volumes:
  maven-cache:
  elasticsearch-data:

networks:
  dts-core:
    name: dts-core        # Real Docker network name
    driver: bridge
