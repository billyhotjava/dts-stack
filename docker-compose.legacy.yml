      - ./services/dts-airflow/logs:/opt/airflow/logs
      - ./services/dts-airflow/plugins:/opt/airflow/plugins
      - ./services/dts-airflow/extra:/opt/airflow/extra:ro,z
      - ./services/dts-airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - dts-core

  dts-airbyte-temporal:
    platform: linux/arm64
    image: ${IMAGE_TEMPORAL}
    container_name: dts-airbyte-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: dts-pg
      POSTGRES_USER: ${PG_SUPER_USER:-postgres}
      POSTGRES_PWD: ${PG_SUPER_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB_TEMPORAL}
    depends_on:
      dts-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dts-core

  dts-airbyte-k8s-mock:
    image: python:3.11-alpine
    container_name: dts-airbyte-k8s-mock
    command: ["python", "/app/server.py"]
    volumes:
      - ./services/dts-airbyte/k8s-mock:/app:ro
    restart: unless-stopped
    networks:
      - dts-core

  dts-airbyte-bootloader:
    platform: linux/arm64
    image: ${IMAGE_AIRBYTE_BOOTLOADER}
    container_name: dts-airbyte-bootloader
    depends_on:
      dts-pg:
        condition: service_healthy
      dts-airbyte-temporal:
        condition: service_started
      dts-airbyte-k8s-mock:
        condition: service_started
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-1.8.2}
      AB_AUTH_SECRET_CREATION_ENABLED: "false"
      KUBERNETES_MASTER: http://dts-airbyte-k8s-mock:8000
      KUBERNETES_TRUST_CERTIFICATES: "true"
      DATABASE_HOST: ${PG_HOST}
      DATABASE_PORT: ${PG_PORT}
      DATABASE_DB: ${PG_DB_AIRBYTE}
      DATABASE_USER: ${PG_USER_AIRBYTE}
      DATABASE_PASSWORD: ${PG_PWD_AIRBYTE}
      DATABASE_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_USERNAME: ${PG_USER_AIRBYTE}
      DATASOURCES_LOCAL_PASSWORD: ${PG_PWD_AIRBYTE}
      DATASOURCES_LOCAL_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASOURCES_LOCAL_SECRETS_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_USERNAME: ${PG_USER_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_PASSWORD: ${PG_PWD_AIRBYTE}
      DATASOURCES_LOCAL_SECRETS_DRIVER_CLASS_NAME: org.postgresql.Driver
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-default}
      KUBERNETES_IN_CLUSTER: "false"
      CONFIG_ROOT: /data/airbyte/config
      WORKSPACE_ROOT: /data/airbyte/workspace
      JAVA_TOOL_OPTIONS: "-Ddatasources.local-secrets.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_AIRBYTE} -Ddatasources.local-secrets.username=${PG_USER_AIRBYTE} -Ddatasources.local-secrets.password=${PG_PWD_AIRBYTE} -Ddatasources.local-secrets.driver-class-name=org.postgresql.Driver"
    volumes:
