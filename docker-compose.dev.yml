      AIRFLOW__CORE__DAG_IGNORE_FILE_SYNTAX: "regexp"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      PIP_ADDITIONAL_REQUIREMENTS: "${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS:-openmetadata-managed-apis==${OPENMETADATA_MANAGED_APIS_VERSION:-1.11.5.0} openmetadata-ingestion==${OPENMETADATA_INGESTION_VERSION:-1.11.5.0}}"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      PYTHONPATH: "/opt/airflow/extra:${PYTHONPATH:-}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${PG_USER_AIRFLOW}:${PG_PWD_AIRFLOW_URLENCODED:-${PG_PWD_AIRFLOW}}@${PG_HOST}:${PG_PORT}/${PG_DB_AIRFLOW}"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${PG_USER_AIRFLOW}:${PG_PWD_AIRFLOW_URLENCODED:-${PG_PWD_AIRFLOW}}@${PG_HOST}:${PG_PORT}/${PG_DB_AIRFLOW}"
      AIRFLOW_HOME: /opt/airflow
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR}
      DBT_IMAGE: ${IMAGE_DBT:-dts-dbt:1.10.0}
      OPENMETADATA_INGEST_IMAGE: ${IMAGE_OPENMETADATA_INGESTION}
      OPENMETADATA_INGEST_CONFIG_DIR: ${OPENMETADATA_INGEST_CONFIG_DIR}
      OPENMETADATA_API_ENDPOINT: ${DTS_PLATFORM_OPENMETADATA_BASE_URL}/api/v1
      OPENMETADATA_AUTH_TOKEN: ${DTS_PLATFORM_OPENMETADATA_AUTH_TOKEN}
      OPENMETADATA_DBT_SERVICE: ${DTS_PLATFORM_OPENMETADATA_SERVICE_NAME:-hive}
      ADDAX_IMAGE: ${IMAGE_ADDAX:-dts-addax:6.0.8}
      ADDAX_JOB_DIR: ${STACK_ROOT}/services/dts-airflow/dags
      ADDAX_DRIVER_DIR: ${STACK_ROOT}/services/dts-platform/drivers
      ADDAX_DRIVER_JARS: ${ADDAX_DRIVER_JARS:-DmJdbcDriver11.jar,postgresql-42.7.9.jar}
      ADDAX_LOG_DIR: ${STACK_ROOT}/logs/addax
    volumes:
      - ./services/dts-airflow/dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
      - ./services/dts-airflow/plugins:/opt/airflow/plugins
      - ./services/dts-airflow/extra:/opt/airflow/extra:ro,z
      - ./services/dts-airflow/config:/opt/airflow/config
      - ./services/dts-platform/drivers:${STACK_ROOT}/services/dts-platform/drivers:ro,z
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - dts-core

  dts-dbt:
    image: ${IMAGE_DBT:-dts-dbt:1.10.0}
    container_name: dts-dbt
    entrypoint: /bin/bash
    command: ["-lc", "sleep infinity"]
    working_dir: /opt/dbt
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DBT_LOG_PATH: /opt/dbt-logs
    volumes:
      - ./services/dts-dbt:/opt/dbt
      - ./services/dts-dbt/profiles:/root/.dbt
      - ./logs/dbt:/opt/dbt-logs:z
    restart: unless-stopped
    networks:
      - dts-core

volumes:
  pnpm-store:
  dts-admin-target:
  dts-platform-target:
  dts-common-target:
  dts-analytics-target:
  elasticsearch-data:

## Note: top-level networks may also be defined in docker-compose.yml
