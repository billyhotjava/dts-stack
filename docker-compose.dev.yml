        published: "3000"
        target: 3000
      - mode: ingress
        protocol: tcp
        published: "5007"
        target: 5007
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./source
        target: /workspace-src
        type: bind
      - source: dts-analytics-target
