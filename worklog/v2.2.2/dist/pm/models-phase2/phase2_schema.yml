version: 2

models:
  # ─── 维度表 ───
  - name: dim_quality_status
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }

  - name: dim_change_category
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }

  - name: dim_signature_status
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }

  # ─── 质量域 DWD ───
  - name: biz_dwd_quality_issue
    columns:
      - name: issue_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: issue_category
        tests:
          - accepted_values:
              config: { severity: warn }
              values: ['设计', '工艺', '管理', '元器件', '操作', '外协外购', '软件', '其他']

  - name: biz_dwd_quality_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ─── 技术状态域 DWD ───
  - name: biz_dwd_tech_state
    columns:
      - name: tech_state_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: change_category
        tests:
          - accepted_values:
              config: { severity: warn }
              values: ['I', 'II', 'III']

  - name: biz_dwd_tech_state_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ─── 风险域 DWD ───
  - name: biz_dwd_risk_info
    columns:
      - name: risk_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: risk_level
        tests:
          - accepted_values:
              config: { severity: warn }
              values: ['高', '中', '低']

  - name: biz_dwd_risk_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ─── 成本域 DWD ───
  - name: biz_dwd_cost_accounting
    columns:
      - name: cost_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ─── DWS 汇总层 ───
  - name: biz_dws_quality_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_tech_state_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_risk_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_cost_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ─── ADS 指标层 ───
  - name: biz_ads_quality_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_tech_state_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_risk_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_cost_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
