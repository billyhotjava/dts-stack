<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建模职责收口原型</title>
<style>
:root {
	--blue: #2468f2;
	--blue-soft: #eaf1ff;
	--ink: #172033;
	--ink-2: #3c4759;
	--muted: #687386;
	--border: #dfe5ee;
	--canvas: #f4f6f9;
	--success: #16844a;
	--success-soft: #e7f7ee;
	--warning: #c46a08;
	--warning-soft: #fff3df;
	--danger: #cf3f3f;
	--danger-soft: #fdeaea;
	--neutral-soft: #eef1f5;
	--proto: #7a4dd8;
	--proto-soft: #f3eefe;
	--radius: 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 13px/1.6 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
button, input, select { font: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- chrome ---------- */
.topbar { display: flex; align-items: center; gap: 18px; height: 48px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--border); }
.topbar__brand { font-weight: 700; letter-spacing: 0.02em; }
.crumbs { color: var(--muted); }
.crumbs b { color: var(--ink); font-weight: 600; }
.shell { display: flex; align-items: flex-start; min-height: calc(100vh - 48px); }
.sidenav { position: sticky; top: 0; flex: 0 0 220px; min-height: calc(100vh - 48px); padding: 10px 8px 24px; background: #fff; border-right: 1px solid var(--border); }
.sidenav__group { margin: 12px 10px 2px; color: var(--muted); font-size: 12px; }
.sidenav__sub { margin: 4px 10px 2px 18px; color: #98a2b3; font-size: 11px; }
.sidenav button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 6px 12px 6px 18px; border: 0; border-radius: var(--radius); background: none; color: var(--ink-2); text-align: left; cursor: pointer; }
.sidenav button:hover { background: var(--canvas); }
.sidenav button.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.badge { min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 400; }
.badge--warn { background: var(--warning); }
.content { flex: 1; min-width: 0; }
.page { padding: 14px 20px 40px; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.page-header h1 { margin: 0; font-size: 18px; }
.page-header p { margin: 2px 0 0; color: var(--muted); }

/* context banner: one jump in, one link back (existing returnTo mechanism) */
.ctx { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid #c9dafd; border-radius: 6px; background: var(--blue-soft); color: var(--ink-2); }
.ctx strong { color: var(--blue); }
.ctx .spacer { flex: 1; }

.card { background: #fff; border: 1px solid var(--border); border-radius: 6px; }
.card + .card { margin-top: 12px; }
.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.card__head strong { font-size: 14px; }
.card__head span { color: var(--muted); font-size: 12px; }
.card__body { padding: 12px 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tabs button { padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink-2); cursor: pointer; }
.tabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { min-height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.filters input { min-width: 260px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; text-align: left; }
.stat.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 20px; }
.proposal { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px dashed var(--proto); border-radius: 3px; color: var(--proto); font-size: 11px; font-weight: 400; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; background: #f9fafc; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.focus td { background: #fffbe6; }
.model-name { font-weight: 600; }
.sub { display: block; color: var(--muted); font-size: 12px; }
.layer { display: inline-block; min-width: 34px; margin-right: 6px; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-2); font-size: 11px; text-align: center; }
.ver { font-weight: 600; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.cell-note { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 28px 0; color: var(--muted); text-align: center; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 11px; font-size: 12px; white-space: nowrap; background: var(--neutral-soft); color: var(--ink-2); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; }
.chip--ok { background: var(--success-soft); color: var(--success); }
.chip--warn { background: var(--warning-soft); color: var(--warning); }
.chip--bad { background: var(--danger-soft); color: var(--danger); }
.chip--run { background: var(--blue-soft); color: var(--blue); }
.chip--none { color: var(--muted); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; color: var(--ink-2); background: #fafbfc; }
.tag--secret { border-color: #f0c2c2; color: #a13030; background: #fff5f5; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 12px; border: 1px solid #cfd8e6; border-radius: var(--radius); background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn--primary:hover { background: #1b57d6; color: #fff; }
.btn--danger { border-color: #efb4b7; color: var(--danger); }
.btn--danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn--sm { min-height: 26px; padding: 0 9px; font-size: 12px; }
.btn--ghost { border-color: transparent; color: var(--blue); }
.btn[disabled] { background: #f4f6f9; border-color: var(--border); color: #a4adbb; cursor: not-allowed; transform: none; }
.link { color: var(--blue); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* quality workspace keeps its own inner navigation, like the real page */
.dq { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; }
.dq__head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
.dq__eyebrow { color: var(--muted); font-size: 12px; }
.dq__title { display: flex; align-items: center; gap: 8px; }
.dq__title h1 { margin: 0; font-size: 18px; }
.dq__where { text-align: right; color: var(--muted); font-size: 12px; }
.dq__where strong { display: block; color: var(--ink); font-size: 14px; }
.dq nav { display: flex; flex-direction: column; gap: 2px; padding: 8px; background: #fff; border: 1px solid var(--border); border-radius: 6px; align-self: start; }
.dq nav button { padding: 6px 10px; border: 0; border-radius: var(--radius); background: none; text-align: left; color: var(--ink-2); cursor: pointer; }
.dq nav button.on { background: var(--blue); color: #fff; }
.dq nav .grp { margin: 6px 10px 0; color: #98a2b3; font-size: 11px; }

/* ---------- dialogs ---------- */
.overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 7vh; background: rgba(23, 32, 51, 0.38); z-index: 20; }
.overlay.open { display: flex; }
.modal { width: 640px; max-width: calc(100vw - 24px); max-height: 86vh; display: flex; flex-direction: column; background: #fff; border-radius: 8px; box-shadow: 0 24px 60px -20px rgba(23, 32, 51, 0.45); }
.modal__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal__title { font-size: 15px; font-weight: 700; }
.modal__title small { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 12px; }
.modal__close { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
.modal__body { padding: 16px 20px; overflow-y: auto; }
.modal__foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.modal__foot .spacer { flex: 1; color: var(--muted); font-size: 12px; }
.state { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 14px; }
.state__dot { flex: 0 0 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.state strong { display: block; font-size: 14px; }
.state p { margin: 2px 0 0; color: var(--ink-2); }
.state--ok { background: var(--success-soft); border-color: #bfe6cf; }
.state--ok .state__dot { background: var(--success); }
.state--bad { background: var(--danger-soft); border-color: #f2c4c6; }
.state--bad .state__dot { background: var(--danger); }
.state--run { background: var(--blue-soft); border-color: #c9dafd; }
.state--run .state__dot { background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
.state--hold { background: var(--warning-soft); border-color: #f0d6ac; }
.state--hold .state__dot { background: var(--warning); }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .state--run .state__dot { animation: none; } .bar__fill { transition: none; } }
.progress { margin-top: 10px; }
.bar { height: 6px; border-radius: 3px; background: #d8e4fb; overflow: hidden; }
.bar__fill { height: 100%; background: var(--blue); transition: width 0.4s ease; }
.phases { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12px; }
.phases .on { color: var(--blue); font-weight: 600; }
.phases .done { color: var(--success); }
.facts { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 9px 14px; margin: 0 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.facts select { min-height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
details.fold { border: 1px solid var(--border); border-radius: 6px; margin-top: 10px; }
details.fold > summary { padding: 8px 12px; cursor: pointer; color: var(--ink-2); }
details.fold[open] > summary { border-bottom: 1px solid var(--border); }
details.fold .fold__body { padding: 10px 12px; }
.mini th, .mini td { padding: 6px 8px; font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
.confirm { margin-top: 12px; padding: 10px 12px; border: 1px dashed #efb4b7; border-radius: 6px; background: #fffafa; }
.confirm p { margin: 0 0 8px; }
.summary-ok { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #bfe6cf; border-radius: 6px; background: var(--success-soft); color: var(--success); }
.checklist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 6px; }
.check { display: grid; grid-template-columns: 22px 92px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); }
.check:last-child { border-bottom: 0; }
.check__icon { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.check--ok .check__icon { background: var(--success); }
.check--warn .check__icon { background: var(--warning); }
.check--bad .check__icon { background: var(--danger); }
.check--wait .check__icon { background: #a4adbb; }
.check__name { color: var(--ink-2); font-weight: 600; }
.check--warn .check__text { color: var(--warning); }
.check--bad .check__text { color: var(--danger); }
.check--wait .check__text { color: var(--muted); }
.owner { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.policy { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--border); border-radius: 9px; color: var(--muted); font-size: 11px; }
.field { display: grid; gap: 5px; margin-top: 14px; }
.field textarea { min-height: 54px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); font: inherit; resize: vertical; }
.field .req { color: var(--danger); }
.note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.handoff { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--canvas); color: var(--ink-2); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; padding: 9px 16px; border-radius: 6px; background: var(--ink); color: #fff; transition: opacity 0.2s, transform 0.2s; z-index: 40; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.console { margin: 12px 20px 0; background: #fff; border: 1px dashed var(--proto); border-radius: 8px; }
.console__head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--proto-soft); color: var(--proto); font-weight: 700; border-radius: 8px 8px 0 0; cursor: pointer; }
.console__body { padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 22px; }
.console.min .console__body { display: none; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; padding: 3px 10px; background: #fff; cursor: pointer; }
.seg button.on { background: var(--proto); color: #fff; }
.console label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
.console .pending { color: var(--warning); }
.console ul { margin: 0; padding-left: 16px; color: var(--ink-2); font-size: 12px; flex: 1 1 360px; }

@media (max-width: 960px) { .sidenav { display: none; } .dq { grid-template-columns: minmax(0, 1fr); } .dq nav { flex-direction: row; flex-wrap: wrap; } .dq nav .grp { display: none; } }
@media (max-width: 760px) {
	.page { padding: 12px 12px 40px; }
	.console { margin: 12px 12px 0; }
	th, td { padding: 8px; }
	.col-secondary { display: none; }
	.filters input { min-width: 0; flex: 1 1 100%; }
	.check { grid-template-columns: 22px minmax(0, 1fr); }
	.check__text, .check__act { grid-column: 2; }
}
</style>
</head>
<body>
<header class="topbar">
	<span class="topbar__brand">DTS 数据治理平台</span>
	<nav class="crumbs" aria-label="面包屑" id="crumbs"></nav>
</header>
<div class="shell">
<nav class="sidenav" aria-label="门户菜单（按本机门户菜单裁剪）">
	<div class="sidenav__group">工作台</div>
	<button type="button" data-route="todo">待办事项 <span id="badge-todo"></span></button>
	<div class="sidenav__group">数据建模</div>
	<div class="sidenav__sub">维度建模</div>
	<button type="button" data-route="workbench">模型工作台</button>
	<div class="sidenav__group">数据开发与运维</div>
	<div class="sidenav__sub">运维中心</div>
	<button type="button" data-route="ops">任务实例监控 <span id="badge-ops"></span></button>
	<div class="sidenav__group">数据治理</div>
	<div class="sidenav__sub">数据地图与资产</div>
	<button type="button" data-route="catalog">数据资产目录 <span id="badge-catalog"></span></button>
	<button type="button" data-route="access">权限申请</button>
	<button type="button" data-route="quality">质量管控 <span id="badge-quality"></span></button>
	<button type="button" data-route="quality/report">质量报告</button>
</nav>
<div class="content">
<section class="console" id="console" aria-label="原型控制台">
	<div class="console__head" id="consoleHead"><span>原型控制台（仅原型，非产品界面）· 各模块结果独立模拟</span><span id="consoleToggle">收起</span></div>
	<div class="console__body">
		<label>质量策略（系统管理 → 模型发布治理）
			<span class="seg" data-key="policy"><button type="button" data-v="ADVISORY" class="on">提示</button><button type="button" data-v="BLOCKING">阻断</button></span>
		</label>
		<label>当前身份
			<span class="seg" data-key="role"><button type="button" data-v="owner" class="on">数据管理员</button><button type="button" data-v="reviewer">发布评审人</button></span>
		</label>
		<label>构建结果（M2）
			<span class="seg" data-key="buildOutcome"><button type="button" data-v="success" class="on">成功</button><button type="button" data-v="fail">失败</button><button type="button" data-v="pending">待确认</button></span>
		</label>
		<label>登记交接（M3）
			<span class="seg" data-key="catalogOutcome"><button type="button" data-v="success" class="on">成功</button><button type="button" data-v="fail">失败</button><button type="button" data-v="slow">延迟</button></span>
		</label>
		<label><span>登记范围 <span class="pending">（待决策）</span></span>
			<span class="seg" data-key="catalogScope"><button type="button" data-v="all" class="on">所有环境</button><button type="button" data-v="prod">仅生产环境</button></span>
		</label>
		<label>质量验证（M4）
			<span class="seg" data-key="qualityOutcome"><button type="button" data-v="pass" class="on">通过</button><button type="button" data-v="fail">未通过</button></span>
		</label>
		<ul>
			<li>左侧菜单与页面名称取自本机当前门户菜单；每个模块在自己的页面发现并处理待办。</li>
			<li>分析准备不是独立页面：它是数据资产目录中的「服务状态」列。运行结果在「任务实例监控」。</li>
			<li>标有 <span class="proposal">提议</span> 的是现有系统没有、本原型建议新增的内容。</li>
		</ul>
		<button type="button" class="btn btn--sm" id="reset">重置全部场景</button>
	</div>
</section>
<main class="page" id="page"></main>
</div>
</div>

<div class="overlay" id="buildOverlay" aria-hidden="true">
	<section class="modal" role="dialog" aria-modal="true" aria-labelledby="buildTitle">
		<div class="modal__head"><div class="modal__title" id="buildTitle"></div><button class="modal__close" type="button" aria-label="关闭" data-close="build">×</button></div>
		<div class="modal__body" id="buildBody"></div>
		<div class="modal__foot" id="buildFoot"></div>
	</section>
</div>
<div class="overlay" id="publishOverlay" aria-hidden="true">
	<section class="modal" role="dialog" aria-modal="true" aria-labelledby="publishTitle">
		<div class="modal__head"><div class="modal__title" id="publishTitle"></div><button class="modal__close" type="button" aria-label="关闭" data-close="publish">×</button></div>
		<div class="modal__body" id="publishBody"></div>
		<div class="modal__foot" id="publishFoot"></div>
	</section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
	"use strict";
	var ENV = { dev: "开发环境", test: "测试环境", prod: "生产环境" };
	var PHASES = ["准备", "加工", "工程核验", "结果回写"];
	var ROUTES = {
		workbench: { crumbs: ["数据建模", "维度建模"], title: "模型工作台" },
		todo: { crumbs: ["工作台"], title: "待办事项" },
		ops: { crumbs: ["数据开发与运维", "运维中心"], title: "任务实例监控" },
		catalog: { crumbs: ["数据治理", "数据地图与资产"], title: "数据资产目录" },
		access: { crumbs: ["数据治理", "数据地图与资产"], title: "权限申请" },
		quality: { crumbs: ["数据治理"], title: "质量管控" },
		"quality/report": { crumbs: ["数据治理"], title: "质量报告" }
	};
	/* Each module owns its own state; nothing derives one module's result from another's. */
	var BASE = [
		{ id: "m1", name: "biz_dwd_budget_v2", cn: "预算明细", layer: "DWD", design: 2, designState: "已保存", sql: 0, owner: "财务部",

			'<dt>构建模式</dt><dd><select aria-label="构建模式"' + (running ? " disabled" : "") + "><option>数据构建</option><option>仅结构（不写入数据）</option></select></dd></dl>" +

	function startBuild(m) {

		S.confirm = null; tick(m);
	}
	function tick(m) {
		clearTimeout(S.timers[m.id]);
		S.timers[m.id] = setTimeout(function () {
			var b = m.build; if (!b || b.state !== "running") return;
			if (b.phase < PHASES.length - 1) { b.phase += 1; render(); tick(m); return; }
			b.dur = "4s";
			if (S.buildOutcome === "fail") { b.state = "failed"; b.reason = "目标数仓连接超时"; b.fix = "请确认目标数仓可访问后重新构建"; b.code = "DBT_TARGET_CONNECTION_TIMEOUT"; }
			else if (S.buildOutcome === "pending") b.state = "pending";
			else completeBuild(m);
			render();
		}, m.build && m.build.slow ? 3500 : 1100);
	}
	/* M2 confirms its own result, then hands off to M3. It never sets catalog/serving/quality/run results. */
	function completeBuild(m) {

			return;

		m.catalog = { rev: b.rev, env: b.env, runId: b.runId, state: "queued", consumable: prev ? prev.consumable : false, serving: "none", level: prev ? prev.level : "内部" };
		settleCatalog(m, b.runId, S.catalogOutcome);

	/* ================= M6a 版本发布弹窗 ================= */
	function publishTarget(m) { return m.build && m.build.state === "success" && m.build.rev === m.design ? m.build : null; }
	function checks(m) {
		var b = publishTarget(m), rows = [], blocking = S.policy === "BLOCKING";
		rows.push(b ? ["ok", "构建证据", "r" + b.rev + " · " + ENV[b.env] + " · " + b.runId, null, "模型工作台"]

		rows.push(b ? ["ok", "工程核验", "随构建完成", null, "模型工作台"] : ["wait", "工程核验", "构建完成后检查", null, "模型工作台"]);
		var c = m.catalog && b && m.catalog.rev === b.rev ? m.catalog : null;
		if (!b) rows.push(["wait", "资产身份", "构建完成后检查", null, "数据资产目录"]);
		else if (!c) rows.push(["bad", "资产身份", "尚未交接登记", ["去数据资产目录", "catalog"], "数据资产目录"]);
		else if (c.state === "ok") rows.push(["ok", "资产身份", "已登记", null, "数据资产目录"]);
		else if (c.state === "queued") rows.push(["bad", "资产身份", "登记排队中，完成后可发布", ["去数据资产目录", "catalog"], "数据资产目录"]);
		else if (c.state === "skipped") rows.push(["bad", "资产身份", ENV[c.env] + "构建不登记资产；发布需要生产环境构建", ["去构建", "build"], "数据资产目录"]);
		else rows.push(["bad", "资产身份", "登记失败：" + esc(c.reason || "未知原因"), ["去数据资产目录处理", "catalog"], "数据资产目录"]);
		var q = m.quality && b && m.quality.rev === b.rev ? m.quality : null;
		var qState = q ? q.state : "none";
		var qText = { passed: "验证通过", failed: "验证未通过", missing: "缺少质量规则", none: "尚未验证" }[qState];
		var pTag = '<span class="policy">' + (blocking ? "阻断策略" : "提示策略") + "</span>";
		if (qState === "passed") rows.push(["ok", "数据质量", qText + pTag, ["查看结果", "quality"], "质量管控"]);
		else rows.push([blocking ? "bad" : "warn", "数据质量", qText + (blocking ? "，阻断策略下不能发布" : "（提示，不影响发布；结论如实保留）") + pTag, ["去质量管控", "quality"], "质量管控"]);
		if (m.review) {
			var r = m.request;
			rows.push(r && r.state === "approved" ? ["ok", "审批", "评审通过", null, "发布"] : r && r.state === "review" ? ["warn", "审批", "等待发布评审人处理", null, "发布"] : ["warn", "审批", "需要评审：提交后由独立评审人处理", null, "发布"]);
		} else rows.push(["ok", "审批", "无需评审（数据管理员自助发布）", null, "发布"]);
		rows.push(["ok", "权限与密级", "通过", null, "权限"]);
		return rows;
	}
	function checklistHtml(rows) {
		return '<ul class="checklist" aria-label="发布检查">' + rows.map(function (r) {
			var icon = { ok: "✓", warn: "!", bad: "×", wait: "…" }[r[0]];
			return '<li class="check check--' + r[0] + '"><span class="check__icon" aria-hidden="true">' + icon + '</span><span class="check__name">' + r[1] + '<span class="owner">' + r[4] + '</span></span><span class="check__text">' + r[2] +
				'</span><span class="check__act">' + (r[3] ? '<button type="button" class="link" data-go="' + r[3][1] + '">' + r[3][0] + "</button>" : "") + "</span></li>";
		}).join("") + "</ul>";
	}
	function renderPublish() {
		var m = find(S.openPublish); if (!m) return;
		var b = publishTarget(m), rows = checks(m), body = "", foot = [];
		var blockers = rows.filter(function (r) { return r[0] === "bad"; });
		var notes = rows.filter(function (r) { return r[0] === "warn" || r[0] === "wait"; });
		$("publishTitle").innerHTML = "版本发布 <small>" + esc(m.name) + "</small>";
		body += '<dl class="facts"><dt>发布版本</dt><dd>' + (b ? "r" + b.rev + " · 构建 " + b.runId + "（" + ENV[b.env] + "）" : "当前设计 r" + m.design + "（尚无可发布的构建）") + "</dd>" +
			"<dt>当前正式版本</dt><dd>" + (m.published ? "r" + m.published.rev + " · " + m.published.at + " 发布" : "无") + "</dd></dl>";
		if (!blockers.length && !notes.length) {
			body += '<div class="summary-ok">✓ 发布检查全部通过（' + rows.length + ' 项） <button type="button" class="link" data-a="toggleChecks">' + (S.showChecks ? "收起明细" : "查看明细") + "</button></div>";
			if (S.showChecks) body += checklistHtml(rows);
		} else body += checklistHtml(rows);
		var r = m.request, awaiting = m.review && r && r.state === "review" && b && r.rev === b.rev;
		if (awaiting && S.role === "reviewer") {
			body += '<div class="field"><label for="reason">评审意见（驳回时必填）</label><textarea id="reason"></textarea></div>';
			foot.push(btn("审核通过", "approve", "primary")); foot.push(btn("驳回", "reject", "danger"));
		} else if (awaiting) {
			body += '<p class="note">已提交评审，等待独立发布评审人处理；提交人不能评审自己的发布。（在控制台切换为「发布评审人」体验）</p>';
		} else {
			var needReview = m.review && !(r && r.state === "approved" && b && r.rev === b.rev);
			foot.push(btn(needReview ? "提交评审" : "发布 r" + (b ? b.rev : m.design), needReview ? "submitReview" : "publish", "primary", blockers.length ? " disabled" : ""));
		}
		body += '<p class="note">发布只登记正式版本：不开放资产访问（数据资产目录 › 权限申请）、不同步分析服务（数据资产目录 › 服务状态）、不部署或启用调度（运维中心）。</p>';
		if (m.published) {
			var rb = S.confirm && S.confirm.kind === "rollback";
			body += '<details class="fold"' + (rb ? " open" : "") + '><summary>回滚当前正式版本 r' + m.published.rev + '</summary><div class="fold__body"><div class="field" style="margin-top:0"><label for="rollbackReason">回滚说明 <span class="req">*</span></label><textarea id="rollbackReason"></textarea></div>' +
				(rb ? confirmBox("回滚后 r" + m.published.rev + " 不再是正式版本；物理表与调度不会被删除，调度版本需在运维中心另行切换。确认回滚？", "doRollback") : '<p style="margin:8px 0 0">' + btn("回滚发布", "askRollback", "danger") + "</p>") +
				"</div></details>";
		}
		$("publishBody").innerHTML = body;
		var summary = blockers.length ? "有 " + blockers.length + " 项阻止发布：" + blockers.map(function (x) { return x[1]; }).join("、") : "";
		$("publishFoot").innerHTML = '<span class="spacer">' + esc(summary) + "</span>" + btn("关闭", "closePublish") + foot.reverse().join("");
	}

	/* ================= wiring ================= */
	function openOverlay(id) { var o = $(id); o.classList.add("open"); o.setAttribute("aria-hidden", "false"); setTimeout(function () { var f = o.querySelector(".modal__foot .btn--primary:not([disabled])") || o.querySelector(".modal__close"); if (f) f.focus(); }, 30); }
	function closeOverlay(which) { var id = which + "Overlay"; $(id).classList.remove("open"); $(id).setAttribute("aria-hidden", "true"); S.confirm = null; if (which === "build") S.openBuild = null; else { S.openPublish = null; S.showChecks = false; } }
	function openBuild(id) { S.openBuild = id; S.confirm = null; renderBuild(); openOverlay("buildOverlay"); }
	function openPublish(id) { S.openPublish = id; S.confirm = null; S.showChecks = false; renderPublish(); openOverlay("publishOverlay"); }

	document.addEventListener("click", function (e) {
		var nav = e.target.closest(".sidenav [data-route]");
		if (nav) { closeOverlay("build"); closeOverlay("publish"); go(nav.dataset.route); return; }
		var tabBtn = e.target.closest("[data-tab]");
		if (tabBtn) { var p = tabBtn.dataset.tab.split(":"); S.tab[p[0]] = p[1]; render(); return; }
		var dq = e.target.closest("[data-dq]");
		if (dq) { S.tab.quality = dq.dataset.dq; go(dq.dataset.dq === "report" ? "quality/report" : "quality", { focus: S.focus, ctx: S.ctx }); return; }
		var todoBtn = e.target.closest("[data-todo]");
		if (todoBtn) { S.filter.todo = todoBtn.dataset.todo; render(); return; }
		var t = e.target.closest("[data-act],[data-a],[data-go],[data-close]");
		if (!t) return;
		if (t.dataset.close) { closeOverlay(t.dataset.close); return; }
		var m;
		if (t.dataset.act) {
			m = find(t.dataset.id);
			if (t.dataset.act === "edit") { toast("打开「" + m.name + "」设计（原型不展开）；保存设计不要求构建、登记或质量"); return; }
			if (t.dataset.act === "validate") { m.designState = "已校验"; toast("r" + m.design + " 设计校验通过（只检查设计本身）"); render(); return; }
			if (t.dataset.act === "build") { openBuild(m.id); return; }
			if (t.dataset.act === "publish") { openPublish(m.id); return; }
		}
		if (t.dataset.go && !t.dataset.a) {
			m = find(S.openPublish);
			closeOverlay("publish");
			if (t.dataset.go === "build") { openBuild(m.id); return; }
			if (t.dataset.go === "quality") S.tab.quality = "tables";
			go(t.dataset.go, { focus: m.id, ctx: { modelId: m.id, from: "publish" } });
			return;
		}
		var a = t.dataset.a, id = t.dataset.id;
		switch (a) {
			case "backToModel": var back = S.ctx; go("workbench", { focus: back.modelId }); if (back.from === "publish") openPublish(back.modelId); return;
			case "startBuild": startBuild(find(S.openBuild)); break;
			case "askAbandon": S.confirm = { id: S.openBuild, kind: "abandon" }; break;
			case "doAbandon": m = find(S.openBuild); m.build.state = "failed"; m.build.reason = "本次构建已放弃"; m.build.fix = "可以重新构建；已写入的数据未回滚"; m.build.code = "MODEL_BUILD_ABANDONED"; S.confirm = null; toast("已放弃本次构建"); break;
			case "askCloseOccupied": S.confirm = { id: S.openBuild, kind: "closeOccupied" }; break;
			case "doCloseOccupied": m = find(S.openBuild); m.build = null; S.confirm = null; toast("占用发布单已关闭，已有构建结果保留；现在可以开始构建"); break;
			case "continueVerify": m = find(S.openBuild); completeBuild(m); toast("核验完成，构建完成（SQL 未重新执行）"); break;
			case "cancelConfirm": S.confirm = null; break;
			case "closeBuild": closeOverlay("build"); break;
			case "closePublish": closeOverlay("publish"); break;
			case "toggleChecks": S.showChecks = !S.showChecks; break;
			case "submitReview": m = find(S.openPublish); m.request = { state: "review", rev: m.build.rev }; toast("已提交发布评审"); break;
			case "approve": m = find(S.openPublish); m.request.state = "approved"; toast("评审通过；由数据管理员完成发布"); break;
			case "reject":
				if (!$("reason").value.trim()) { $("reason").focus(); toast("驳回必须填写评审意见"); return; }
				m = find(S.openPublish); m.request = null; toast("已驳回；构建结果不受影响"); break;
			case "publish": m = find(S.openPublish); m.published = { rev: m.build.rev, at: now() }; m.request = null;
				toast("r" + m.published.rev + " 已发布为正式版本。调度在运维中心单独部署并启用"); break;
			case "askRollback":
				if (!$("rollbackReason").value.trim()) { $("rollbackReason").focus(); toast("回滚必须填写说明"); return; }
				S.confirm = { id: S.openPublish, kind: "rollback" }; break;
			case "doRollback": m = find(S.openPublish); var old = m.published.rev; m.published = null; closeOverlay("publish"); toast("r" + old + " 已撤销正式版本；调度版本未自动更改，请在运维中心确认"); break;
			case "retryCatalog": m = find(id); m.catalog.state = "queued"; settleCatalog(m, m.catalog.runId, S.catalogOutcome); toast("已重新提交登记；不会重新执行构建"); break;
			case "assetDetail": m = find(id); toast("打开「" + m.cn + "」资产详情（原型不展开）"); return;
			case "syncServing": m = find(id); m.catalog.serving = "syncing"; (function (x) { setTimeout(function () { if (x.catalog && x.catalog.serving === "syncing") { x.catalog.serving = "ok"; render(); toast("分析服务同步完成；不影响登记与构建"); } }, 1500); })(m); break;
			case "applyAccess": m = find(id); S.access.push({ modelId: m.id, applicant: "当前用户", at: now(), state: "pending" }); toast("已提交权限申请，审批在「权限申请 / 待办事项」中处理"); break;
			case "approveAccess": var ap = S.access[Number(t.dataset.i)]; ap.state = "approved"; find(ap.modelId).catalog.consumable = true; toast("审批通过，资产变为可消费"); break;
			case "runQuality": m = find(id); m.quality = { rev: m.catalog.rev, state: S.qualityOutcome === "pass" ? "passed" : "failed", rules: Math.max(2, (m.quality && m.quality.rules) || 0), last: now() }; toast(S.qualityOutcome === "pass" ? "质量验证通过" : "质量验证未通过；已生成质量工单，构建结果不变"); break;
			case "viewLog": toast("打开日志（原型不展开）"); return;
			case "fixModel": m = find(id); go("workbench", { focus: m.id }); openBuild(m.id); return;
			case "rerun": m = find(id); m.runs.unshift({ id: t.dataset.run + "-r", state: "success", start: now(), end: now(), dur: "9m12s", attempt: 1, note: "" }); m.runs.forEach(function (r) { if (r.id === t.dataset.run) r.note = (r.note ? r.note + "；" : "") + "已重试"; }); toast("重试成功；发布与构建结果未变"); break;
			case "deployRun": m = find(id); m.schedule = { rev: m.published.rev, enabled: true, cron: "每日 02:00" }; toast("r" + m.published.rev + " 已部署并启用；每次运行在任务实例中单独记录"); break;
			case "gotoTodo": m = find(id); if (t.dataset.go === "quality") S.tab.quality = "tables"; go(t.dataset.go, { focus: m.id }); return;
		}
		render();
	});
	document.addEventListener("input", function (e) {
		if (e.target.id === "catalogSearch") { S.filter.catalog = e.target.value; var pos = e.target.selectionStart; render(); var el = $("catalogSearch"); el.focus(); el.setSelectionRange(pos, pos); }
	});
	document.addEventListener("change", function (e) {
		if (e.target.id === "opsState" || e.target.id === "opsType") { S.filter.ops = { state: $("opsState").value, type: $("opsType").value }; render(); }
	});
	document.addEventListener("keydown", function (e) {
		if (e.key !== "Escape") return;
		if (S.openPublish) { closeOverlay("publish"); return; }
		if (S.openBuild) closeOverlay("build");
	});
	Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (seg) {
		seg.addEventListener("click", function (e) {
			var b = e.target.closest("button"); if (!b) return;
			Array.prototype.forEach.call(seg.children, function (c) { c.classList.toggle("on", c === b); });
			S[seg.dataset.key] = b.dataset.v;
			if (seg.dataset.key === "policy") toast(S.policy === "BLOCKING" ? "阻断策略：质量未通过时不能发布（不改变构建和质量结论）" : "提示策略：质量问题只提示");
			if (seg.dataset.key === "catalogScope") toast(S.catalogScope === "prod" ? "仅生产环境构建登记资产（对之后的构建生效）" : "所有环境构建都登记资产");
			render();
		});
	});
	$("consoleHead").addEventListener("click", function () { var c = $("console"); c.classList.toggle("min"); $("consoleToggle").textContent = c.classList.contains("min") ? "展开" : "收起"; });
	$("reset").addEventListener("click", function () {
		Object.keys(S.timers).forEach(function (k) { clearTimeout(S.timers[k]); });
		S.models = clone(BASE); S.access = []; S.confirm = null; S.tab = {}; S.filter = {};
		closeOverlay("build"); closeOverlay("publish");
		go("workbench"); tick(find("m7")); toast("已重置全部场景");
	});
	var initial = location.hash.replace(/^#\//, "");
	S.route = ROUTES[initial] ? initial : "workbench";
	render();
	tick(find("m7"));
})();
</script>
</body>
</html>
