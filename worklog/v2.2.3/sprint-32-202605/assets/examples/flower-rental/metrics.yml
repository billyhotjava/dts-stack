metrics:
  - metric_code: contract_cnt
    metric_name: 合同数
    business_object: rental_contract
    source_asset_code: dwd_flower_contract_detail
    term_ids:
      - glossary.contract_count
    description: 统计租赁合同数量。
    formula:
      type: aggregation
      aggregation: count_distinct
      field: contract_id
    unit: 个
    format: integer
    default_grain:
      - stat_month
      - dept_id
  - metric_code: contract_amount
    metric_name: 合同金额
    business_object: rental_contract
    source_asset_code: dwd_flower_contract_detail
    term_ids:
      - glossary.contract_amount
    description: 统计租赁合同金额。
    formula:
      type: aggregation
      aggregation: sum
      field: contract_amount
    unit: 元
    format: decimal
    default_grain:
      - stat_month
      - dept_id
  - metric_code: collection_rate
    metric_name: 回款率
    business_object: rental_contract
    source_asset_code: dwd_flower_contract_detail
    term_ids:
      - glossary.collection_rate
    description: 已回款金额占合同金额的比例。
    formula:
      type: ratio
      numerator:
        type: aggregation
        aggregation: sum
        field: received_amount
      denominator:
        type: aggregation
        aggregation: sum
        field: contract_amount
      multiply: 100
      zero_division: null
    unit: "%"
    format: percent
    default_grain:
      - stat_month
      - dept_id
  - metric_code: high_risk_project_cnt
    metric_name: 高风险项目数
    business_object: rental_project
    source_asset_code: dwd_flower_project_detail
    term_ids:
      - glossary.high_risk_project
    description: 风险等级为高的租赁项目数量。
    formula:
      type: conditional_count
      field: project_id
      distinct: true
      condition:
        field: risk_level
        operator: "="
        value: 高
    unit: 个
    format: integer
    default_grain:
      - stat_month
      - dept_id
      - risk_level
