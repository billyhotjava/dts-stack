  - name: finance_month
    description: 统计月份
    data_type: date
  - name: project_count
    description: 发生财务活动的项目数
    data_type: bigint
  - name: unmapped_project_count
    description: 无法关联客户的项目汇总行数
    data_type: bigint
  - name: receivable_before_discount
    description: 月结折前应收
    data_type: numeric
  - name: discounted_receivable
    description: 月结折后应收
    data_type: numeric
  - name: ledger_received_amount
    description: 月结账面实收
    data_type: numeric
  - name: confirmed_collection_amount
    description: 本月确认租摆现金收入
