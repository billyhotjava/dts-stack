version: 2
models:
- name: prs_v2_dws_project_operations_monthly
  description: 项目月度租赁业务汇总
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - prs
    - v2
    - dws
    meta:
      dts:
        modelType: SUMMARY
        layer: DWS
        domainCode: DATA_PRS
        grain:
          statement: 项目月度租赁业务汇总；唯一粒度：project_month_key
          keys:
          - project_month_key
        sourceRefs:
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsp_contract
          layer: ODS
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsp_project
          layer: ODS
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prst_flower_biz_info
          layer: ODS
        - kind: DBT_MODEL
          ref: model.prs_flower_v2.prs_v2_dwd_flower_order
          layer: DWD
        fieldRoles:
          project_month_key: BUSINESS_KEY
          tenant_id: ATTRIBUTE
          project_id: ATTRIBUTE
          business_month: TIME
          effective_order_count: MEASURE
          finished_order_count: MEASURE
          pending_order_count: MEASURE
          change_order_count: MEASURE
          add_order_count: MEASURE
          cut_order_count: MEASURE
          transfer_order_count: MEASURE
          sale_order_count: MEASURE
          finished_rent_change_amount: MEASURE
          finished_order_cost: MEASURE
          finished_sale_amount: MEASURE
          missing_business_time_count: MEASURE
          missing_rent_amount_count: MEASURE
        consumptionScenarios:
        - 项目月度租赁业务汇总
        technicalOnly: false
    alias: prs_v2_dws_project_operations_monthly
  columns:
  - name: project_month_key
    description: 项目业务月份键
    data_type: text
  - name: tenant_id
    description: 租户编号
    data_type: bigint
  - name: project_id
    description: 项目编号
    data_type: bigint
  - name: business_month
    description: 业务月份
    data_type: date
  - name: effective_order_count
    description: 有效业务单数
    data_type: bigint
  - name: finished_order_count
    description: 已结束业务单数
    data_type: bigint
  - name: pending_order_count
    description: 尚未结束有效业务单数
    data_type: bigint
  - name: change_order_count
    description: 换花有效单数
    data_type: bigint
  - name: add_order_count
    description: 加花有效单数
    data_type: bigint
  - name: cut_order_count
    description: 减花有效单数
    data_type: bigint
  - name: transfer_order_count
    description: 调花有效单数
    data_type: bigint
  - name: sale_order_count
    description: 售花有效单数
    data_type: bigint
  - name: finished_rent_change_amount
    description: 已结束业务单租金变动原值合计非月租收入
    data_type: numeric
  - name: finished_order_cost
    description: 已结束业务单源成本合计
    data_type: numeric
  - name: finished_sale_amount
    description: 已结束售花单金额
    data_type: numeric
  - name: missing_business_time_count
    description: 缺少业务时间单数
    data_type: bigint
  - name: missing_rent_amount_count
    description: 已结束单缺少租金变动金额数
    data_type: bigint
- name: prs_v2_dws_finance_monthly_summary
  description: 项目月度应收与现金收入并列汇总
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - prs
    - v2
    - dws
    meta:
      dts:
        modelType: SUMMARY
        layer: DWS
        domainCode: DATA_PRS
        grain:
          statement: 项目月度应收与现金收入并列汇总；唯一粒度：project_month_key
          keys:
          - project_month_key
        sourceRefs:
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsa_collection_record
          layer: ODS
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsa_month_accounting
          layer: ODS
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsp_contract
          layer: ODS
        - kind: TABLE
          ref: source.prs_flower_v2.public.ods_prsp_project
          layer: ODS
        - kind: DBT_MODEL
          ref: model.prs_flower_v2.prs_v2_dwd_finance_month_settlement
          layer: DWD
        - kind: DBT_MODEL
          ref: model.prs_flower_v2.prs_v2_dwd_finance_collection
          layer: DWD
        fieldRoles:
          project_month_key: BUSINESS_KEY
          tenant_id: ATTRIBUTE
          project_id: ATTRIBUTE
          finance_month: TIME
          settlement_count: MEASURE
          collection_count: MEASURE
          receivable_before_discount: MEASURE
          discounted_receivable: MEASURE
          ledger_received_amount: MEASURE
          confirmed_collection_amount: MEASURE
          missing_receivable_count: MEASURE
          missing_collection_amount_count: MEASURE
        consumptionScenarios:
        - 项目月度应收与现金收入并列汇总
        technicalOnly: false
    alias: prs_v2_dws_finance_monthly_summary
  columns:
  - name: project_month_key
    description: 项目财务月份键
    data_type: text
  - name: tenant_id
    description: 租户编号
    data_type: bigint
  - name: project_id
    description: 项目编号
    data_type: bigint
  - name: finance_month
    description: 月结月份或实际收款月份
    data_type: date
  - name: settlement_count
    description: 已确认月结记录数
    data_type: bigint
  - name: collection_count
    description: 已确认租摆收入收款单数
    data_type: bigint
  - name: receivable_before_discount
    description: 本月已确认月结折前应收
    data_type: numeric
  - name: discounted_receivable
    description: 本月已确认月结折后应收
    data_type: numeric
  - name: ledger_received_amount
    description: 本月月结账面累计实收不等于本月现金流
    data_type: numeric
  - name: confirmed_collection_amount
    description: 本月确认租摆现金收入与账期无必然对应
    data_type: numeric
  - name: missing_receivable_count
    description: 缺少折后应收记录数
    data_type: bigint
  - name: missing_collection_amount_count
    description: 缺少确认收款金额记录数
    data_type: bigint
