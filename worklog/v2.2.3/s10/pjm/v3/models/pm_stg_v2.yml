version: 2

models:
  - name: stg_pm__project_subject_domain_v2
    description: "进度 ODS 的结构化语义层：字段清洗、类型统一、来源元数据保留，粒度为单条 ODS 行"
    columns:
      - name: source_row_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: project_no
        description: "项目编号，保留 ODS 原始粒度"
      - name: completion_status
        description: "标准化后的完成情况"
      - name: node_type
        description: "标准化后的节点类型"
      - name: risk_level
        description: "标准化后的风险等级"

  - name: stg_pm__quality_issue_v2
    description: "质量 ODS 的结构化语义层：状态/分类标准化、日期数值解析、来源元数据保留"
    columns:
      - name: source_row_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: status
        description: "标准化后的质量归零状态"
      - name: issue_category
        description: "标准化后的原因分类"
      - name: has_zero_plan
        description: "归零计划是否有效提交"

  - name: stg_pm__tech_state_v2
    description: "技术状态 ODS 的结构化语义层：更改类别、签署状态、整改状态收敛并保留审计字段"
    columns:
      - name: source_row_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: change_category
        description: "标准化后的更改类别"
      - name: file_signature_status
        description: "结合更改类别与评审文本收敛后的文件签署状态"
      - name: reform_status
        description: "标准化后的整改状态"

  - name: stg_pm__risk_info_v2
    description: "风险 ODS 的结构化语义层：风险等级/分类/状态标准化并保留来源元数据"
    columns:
      - name: source_row_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: risk_category
        description: "标准化后的风险分类，供应链/资源/管理统一归入进度风险"
      - name: risk_level
        description: "标准化后的风险等级"
      - name: risk_status
        description: "标准化后的风险状态"
