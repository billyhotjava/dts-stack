version: 2
sources:
  - name: "fin_ods"
    schema: "public"
    description: "财务 ODS 源表（ods_finance_ 前缀）"
    tables:
      - name: "ods_finance_own_fund"
        description: "自有资金表 — 按年度期间记录事业基金、折旧基金、福利基金、安全基金的变动情况"
      - name: "ods_finance_project_fund"
        description: "项目经费表 — 按项目记录总经费、直接成本控制数、间接费用等经费执行数据"
      - name: "ods_finance_aux_balance"
        description: "辅助余额表 — 按科目/部门/合同维度记录辅助核算余额"
      - name: "ods_finance_aux_balance_personal"
        description: "个人辅助余额表 — 按科目/部门/职工维度记录个人辅助核算余额（含借贷方向）"
