version: 2

models:
  # ─── 维度字典 ─────────────────────────────────────────
  - name: dim_fund_source
    description: "基金来源维度字典（年初 / 预计增加 / 预计使用）。"
    columns:
      - name: fund_source_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: code
        tests:
          - accepted_values:
              arguments:
                values: ['年初', '预计增加', '预计使用']
              config:
                severity: warn

  - name: dim_fund_category
    description: "基金类别维度字典（事业基金 / 职工福利基金 / 安全生产基金）。"
    columns:
      - name: fund_category_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: code
        tests:
          - accepted_values:
              arguments:
                values: ['事业基金', '职工福利基金', '安全生产基金']
              config:
                severity: warn

  - name: dim_project_status
    description: "项目状态维度字典（在研 / 支出待处理 / 已完成待收款 / 已完成审计）。"
    columns:
      - name: project_status_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: code
        tests:
          - accepted_values:
              arguments:
                values: ['在研', '支出待处理', '已完成待收款', '已完成审计']
              config:
                severity: warn

  - name: dim_expense_category
    description: "辅助余额费用类别维度表。"
    columns:
      - name: expense_category_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: dim_balance_direction
    description: "个人辅助余额借贷方向维度表。"
    columns:
      - name: balance_direction_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: dim_personal_subject_category
    description: "个人辅助余额科目类别维度表。"
    columns:
      - name: subject_category_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: dim_expense_code_prefix
    description: "辅助余额科目编号前缀 → 费用类别映射表（subject_code 前 4 位）。"
    columns:
      - name: prefix
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: dim_personal_subject_code_prefix
    description: "个人辅助余额科目编号前缀 → 科目类别映射表（subject_code 前 4 位）。"
    columns:
      - name: prefix
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  # ─── DWD 事实 ─────────────────────────────────────────
  - name: biz_dwd_own_fund
    description: "年度基金事实表（长表）：按 年度 × 基金来源 × 基金类别 记录金额；年末余额由 DWS 派生。"
    columns:
      - name: own_fund_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: year_num
        tests:
          - not_null:
              config:
                severity: warn
      - name: fund_source_code
        tests:
          - accepted_values:
              arguments:
                values: ['年初', '预计增加', '预计使用']
              config:
                severity: warn
      - name: fund_category_code
        tests:
          - accepted_values:
              arguments:
                values: ['事业基金', '职工福利基金', '安全生产基金']
              config:
                severity: warn

  - name: biz_dwd_project_fund
    description: "项目经费事实表：补全 direct_spent 直读、总支出、可为负的剩余经费、已收/待收口径，关联项目状态字典。"
    columns:
      - name: project_fund_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: project_id
        tests:
          - not_null:
              config:
                severity: warn

  - name: biz_dwd_aux_balance
    description: "辅助余额事实表：保留合同信息并补齐费用类别、合同标记和余额方向。"
    columns:
      - name: aux_balance_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: expense_category
        tests:
          - accepted_values:
              arguments:
                values: ['原材料/设备', '外协/服务', '折旧', '检测试验', '设计咨询', '租赁', '培训', '其他']
              config:
                severity: warn

  - name: biz_dwd_aux_balance_personal
    description: "个人辅助余额事实表：补齐借贷方向、余额绝对值和科目类别。"
    columns:
      - name: personal_balance_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: balance_direction
        tests:
          - accepted_values:
              arguments:
                values: ['debit', 'credit', 'zero']
              config:
                severity: warn
      - name: subject_category
        tests:
          - accepted_values:
              arguments:
                values: ['其他应收-借款', '应付职工薪酬', '其他']
              config:
                severity: warn

  # ─── DWS 汇总 ─────────────────────────────────────────
  - name: biz_dws_own_fund_yearly
    description: "年度基金汇总表：按 年度 × 基金类别 透视 opening/increase/usage，派生 year_end_balance、net_change_rate 与真正同比增长率。同时产出 fund_category='全部' 的年度合计。"
    columns:
      - name: year_num
        tests:
          - not_null:
              config:
                severity: warn

  - name: biz_dws_project_fund_summary
    description: "项目经费汇总表：多 scope（all_projects / by_major / by_status），含已收/待收、正向剩余经费、超支金额与按项目去重计数。"
    columns:
      - name: summary_scope
        tests:
          - not_null:
              config:
                severity: warn
      - name: scope_key
        tests:
          - not_null:
              config:
                severity: warn

  - name: biz_dws_aux_balance_by_dept
    description: "辅助余额部门汇总表：按部门聚合余额、合同数和科目数。"
    columns:
      - name: dept_name
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: biz_dws_aux_balance_personal_by_dept
    description: "个人辅助余额部门汇总表：按部门聚合净余额、借方、贷方和人员规模。"
    columns:
      - name: employee_dept
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  # ─── ADS KPI ──────────────────────────────────────────
  - name: biz_ads_own_fund_kpi
    description: "年度基金 KPI：按 年度 × 基金类别 输出金额、年末余额、使用率、净变动率、同比增长率与告警等级。"
    columns:
      - name: year_num
        tests:
          - not_null:
              config:
                severity: warn
      - name: usage_rate_level
        tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'warning', 'danger']
              config:
                severity: warn
      - name: net_change_direction
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'flat']
              config:
                severity: warn

  - name: biz_ads_project_fund_kpi
    description: "项目经费 KPI：按 summary_scope × scope_key 输出金额汇总、加权执行率、已收/待收/剩余经费/超支金额、项目计数。待收经费为唯一未收口径。"
    columns:
      - name: summary_scope
        tests:
          - not_null:
              config:
                severity: warn
      - name: scope_key
        tests:
          - not_null:
              config:
                severity: warn

  - name: biz_ads_aux_balance_kpi
    description: "辅助余额 KPI 表：输出余额总览、部门数、合同数和科目数。"
    columns:
      - name: total_balance
        tests:
          - not_null:
              config:
                severity: warn

  - name: biz_ads_aux_balance_personal_kpi
    description: "个人辅助余额 KPI 表：输出净余额、借方贷方合计和人员规模。"
    columns:
      - name: net_balance
        tests:
          - not_null:
              config:
                severity: warn
