version: 2

sources:
  - name: "fin_ods"
    schema: "public"
    description: "财务 ODS 源表。ODS 只承载入湖结果与原始口径，业务语义统一经 STG/DWD 收敛。"
    tables:
      - name: "own_fund"
        identifier: "ods_finance_own_fund"
        description: "自有资金表，按年度期间记录事业基金、折旧基金、福利基金、安全生产基金"

      - name: "project_fund"
        identifier: "ods_finance_project_fund"
        description: "项目经费表，按项目记录总经费、直接成本控制数、间接费用及执行率"

      - name: "aux_balance"
        identifier: "ods_finance_aux_balance"
        description: "辅助余额表，按科目/部门/合同记录辅助核算余额"

      - name: "aux_balance_personal"
        identifier: "ods_finance_aux_balance_personal"
        description: "个人辅助余额表，按科目/部门/职工记录个人辅助核算余额"
