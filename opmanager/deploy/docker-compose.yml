services:
  dts-opmanager:
    image: ${OPMANAGER_IMAGE:-dts-opmanager:2.2.3}
    container_name: dts-opmanager
    restart: unless-stopped
    ports:
      - "${OPMANAGER_HTTP_PORT:-18095}:18090"
    environment:
      OPMANAGER_SERVER_PORT: "18090"
      OPMANAGER_DATA_DIR: /var/lib/dts-opmanager
      OPMANAGER_PACKAGE_ROOTS: /var/lib/dts-opmanager/packages
      OPMANAGER_TARGET_STACK_DIR: ${DTS_STACK_DIR:-/opt/dts-stack}
      OPMANAGER_DOCKER_ENABLED: ${OPMANAGER_DOCKER_ENABLED:-true}
      OPMANAGER_PORTAINER_URL: ${OPMANAGER_PORTAINER_URL:-}
    volumes:
      - ${OPMANAGER_HOST_DATA_DIR:-/var/lib/dts-opmanager}:/var/lib/dts-opmanager
      - ${OPMANAGER_HOST_PACKAGE_DIR:-/var/lib/dts-opmanager/packages}:/var/lib/dts-opmanager/packages
      - ${DTS_STACK_DIR:-/opt/dts-stack}:${DTS_STACK_DIR:-/opt/dts-stack}
      - /var/run/docker.sock:/var/run/docker.sock
