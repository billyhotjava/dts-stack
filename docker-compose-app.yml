      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      dts-core:
        aliases:
          - ${HOST_SSO}
    platform: ${DTS_RUNTIME_PLATFORM:-linux/amd64}
    ports:
