      DTS_PLATFORM_OPENMETADATA_TABLE_FQN_PATTERN: ${DTS_PLATFORM_OPENMETADATA_TABLE_FQN_PATTERN:-"{service}.{database}.{table}"}
      DTS_PLATFORM_OPENMETADATA_UI_BASE_URL: ${DTS_PLATFORM_OPENMETADATA_UI_BASE_URL:-}
      EUREKA_CLIENT_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/etc/dts/truststore.p12 -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD:-changeit} -Djavax.net.ssl.trustStoreType=PKCS12 -Dspring.datasource.url=$${SPRING_DATASOURCE_URL} -Dspring.datasource.username=$${SPRING_DATASOURCE_USERNAME} -Dspring.datasource.password=$${SPRING_DATASOURCE_PASSWORD}
      JHIPSTER_CORS_ALLOW_CREDENTIALS: "true"
      JHIPSTER_CORS_ALLOWED_HEADERS: '*'
      JHIPSTER_CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      JHIPSTER_CORS_ALLOWED_ORIGINS: https://${HOST_PLATFORM_UI},https://${HOST_ADMIN_UI},https://${HOST_API}
      # App-mode remote clients may open the BI UI through http://<host> or a LAN IP.
      # Keep canonical domains explicit, and allow operators to replace the LAN patterns
      # through DTS_CORS_ALLOWED_ORIGIN_PATTERNS when deploying behind a stricter gateway.
      JHIPSTER_CORS_ALLOWED_ORIGIN_PATTERNS: ${DTS_CORS_ALLOWED_ORIGIN_PATTERNS:-https://${HOST_PLATFORM_UI},http://${HOST_PLATFORM_UI},https://${HOST_ADMIN_UI},http://${HOST_ADMIN_UI},https://${HOST_API},http://${HOST_API},http://localhost,http://localhost:[*],http://127.0.0.1,http://127.0.0.1:[*],http://192.168.*,http://192.168.*:[*],https://192.168.*,https://192.168.*:[*],http://10.*,http://10.*:[*],https://10.*,https://10.*:[*],http://172.*,http://172.*:[*],https://172.*,https://172.*:[*]}
      LOG_ROOT: /logs
      PG_DB_BIADMIN: ${PG_DB_BIADMIN:-biadmin}
      PG_HOST: ${PG_HOST:-dts-pg}
      PG_PORT: ${PG_PORT:-5432}
      PG_PWD_BIADMIN: ${PG_PWD_BIADMIN:-}
      PG_USER_BIADMIN: ${PG_USER_BIADMIN:-biadmin}
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_PASSWORD: ${PG_PWD_DTPS:-dts_platform}
      SPRING_DATASOURCE_URL: jdbc:postgresql://dts-pg:5432/${PG_DB_DTPS:-dts_platform}
      SPRING_DATASOURCE_USERNAME: ${PG_USER_DTPS:-dts_platform}
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED_PLATFORM:-true}
      SPRING_PROFILES_ACTIVE: ${DTS_PROFILE:-prod}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${OAUTH2_PLATFORM_CLIENT_ID:-dts-platform}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${OAUTH2_PLATFORM_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OIDC_ISSUER_URI}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      interval: 10s
      retries: 60
      start_period: 60s
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8081/management/health >/dev/null 2>&1 || grep -qE ':[0]*1F91 .* 0A ' /proc/net/tcp || grep -qE ':[0]*1F91 .* 0A ' /proc/net/tcp6
      timeout: 10s
    image: ${IMAGE_DTS_PLATFORM:?Set IMAGE_DTS_PLATFORM in imgversion.conf or .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dts-core
      - traefik.http.routers.dts-platform.rule=Host(`${HOST_API}`) && PathPrefix(`/platform`)
      - traefik.http.routers.dts-platform.entrypoints=websecure
      - traefik.http.routers.dts-platform.tls=true
      - traefik.http.services.dts-platform.loadbalancer.server.port=8081
      - traefik.http.middlewares.dts-strip-platform.stripprefixregex.regex=/platform
      - traefik.http.routers.dts-platform.middlewares=dts-strip-platform@docker,cors-allow@file,security-headers@file
      - traefik.http.routers.dts-platform-uiapi.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/api`)
      - traefik.http.routers.dts-platform-uiapi.entrypoints=websecure
      - traefik.http.routers.dts-platform-uiapi.tls=true
      - traefik.http.routers.dts-platform-uiapi.service=dts-platform
      - traefik.http.routers.dts-platform-uiapi.middlewares=cors-allow@file,security-headers@file
      - traefik.http.routers.dts-platform-swagger.rule=Host(`${HOST_PLATFORM_UI}`) && (Path(`/swagger-ui.html`) || PathPrefix(`/swagger-ui/`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/webjars/`))
      - traefik.http.routers.dts-platform-swagger.entrypoints=websecure
      - traefik.http.routers.dts-platform-swagger.tls=true
      - traefik.http.routers.dts-platform-swagger.service=dts-platform
      - traefik.http.routers.dts-platform-swagger.priority=200
      - traefik.http.routers.dts-platform-swagger.middlewares=cors-allow@file,security-headers@file
    networks:
      dts-core: null
    ports: []
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./services/certs/truststore.p12
        target: /etc/dts/truststore.p12
        type: bind
      - bind:
          create_host_path: true
          selinux: z
        source: ./services/dts-platform/drivers
        target: /opt/dts/drivers
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./services/dts-platform/upload
        target: /opt/dts/upload
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./services/dts-dbt
        target: /opt/dts/dbt
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./services/dts-dbt/profiles
        target: /opt/dts/dbt-profiles
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./services/dts-airflow/dags
        target: /opt/airflow/dags
        type: bind
      - bind:
          create_host_path: true
          selinux: z
        source: ./logs/dts-platform
        target: /logs/dts-platform
        type: bind
  dts-platform-webapp:
    depends_on:
      dts-admin:
        condition: service_healthy
        required: true
      dts-analytics:
        condition: service_healthy
        required: true
      dts-platform:
        condition: service_healthy
        required: true
    environment:
      ALLOWED_EXTERNAL_REDIRECT_HOSTS: ${HOST_PLATFORM_UI},${HOST_META},${HOST_FLOW}
      ANALYTICS_API_PROXY_TARGET: http://dts-analytics:3000
      API_PROXY_TARGET: http://dts-platform:8081
      KOAL_PKI_ENDPOINTS: ${KOAL_PKI_ENDPOINTS:-}
      KOAL_VENDOR_BASE: /vendor/koal
      PLATFORM_PUBLIC_BASE_URL: https://${HOST_PLATFORM_UI}
      TZ: ${TZ:-Asia/Shanghai}
      VITE_ADMIN_API_BASE_URL: https://${HOST_ADMIN_UI}/api
      VITE_ENABLE_SQL_WORKBENCH: ${VITE_ENABLE_SQL_WORKBENCH:-true}
      VITE_HIDE_PASSWORD_LOGIN: ${PLATFORM_VITE_HIDE_PASSWORD_LOGIN:-}
      WEBAPP_PASSWORD_LOGIN_ENABLED: ${PLATFORM_WEBAPP_PASSWORD_LOGIN_ENABLED:-}
      WEBAPP_SHOW_CLASSIFIED_LOGIN_BADGE: ${WEBAPP_SHOW_CLASSIFIED_LOGIN_BADGE:-true}
    image: ${IMAGE_DTS_PLATFORM_WEBAPP:?Set IMAGE_DTS_PLATFORM_WEBAPP in imgversion.conf or .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dts-core
      - traefik.http.routers.dts-platform-ui.rule=Host(`${HOST_PLATFORM_UI}`) && !PathPrefix(`/api`) && !PathPrefix(`/admin/api`) && !PathPrefix(`/analytics`) && !PathPrefix(`/bi/api`) && !PathPrefix(`/screen`) && !PathPrefix(`/dashboards`) && !PathPrefix(`/system`) && !PathPrefix(`/tdv`) && !PathPrefix(`/account`) && !PathPrefix(`/hetu`) && !PathPrefix(`/metrics`) && !PathPrefix(`/static`)
      - traefik.http.routers.dts-platform-ui.priority=100
      - traefik.http.routers.dts-platform-ui.entrypoints=websecure
      - traefik.http.routers.dts-platform-ui.tls=true
      - traefik.http.services.dts-platform-ui.loadbalancer.server.port=80
    networks:
      dts-core: null
    ports: []
    restart: unless-stopped
  dts-proxy:
    command:
      - --api.dashboard=${TRAEFIK_DASHBOARD}
      - --api.insecure=${TRAEFIK_DASHBOARD}
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dts-core
      - --providers.file.filename=/etc/traefik/dynamic/traefik-dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      - --ping=${TRAEFIK_ENABLE_PING}
      - --entrypoints.metrics.address=:${TRAEFIK_METRICS_PORT}
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.Forwarded=keep
      - --accesslog.fields.headers.names.X-Forwarded-For=keep
      - --accesslog.fields.headers.names.X-Forwarded-Host=keep
      - --accesslog.fields.headers.names.X-Forwarded-Proto=keep
      - --accesslog.fields.headers.names.X-Real-IP=keep
      - --log.filepath=/var/log/traefik/traefik.log
      - --serversTransport.insecureSkipVerify=true
      - --log.level=INFO
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
    container_name: dts-proxy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.52}
    extra_hosts:
      - host.docker.internal:${HOST_GATEWAY_IP:-172.17.0.1}
      - hetu.upstream:${HETU_UPSTREAM_IP:-172.17.0.1}
    image: ${IMAGE_TRAEFIK}
    labels:
      - traefik.enable=true
      - traefik.http.routers.hetu-dashboards.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/dashboards`)
