      - --proxy-headers=xforwarded
    container_name: dts-keycloak
    depends_on:
      dts-pg:
        condition: service_healthy
        required: true
    environment:
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC
      KC_DB: postgres
