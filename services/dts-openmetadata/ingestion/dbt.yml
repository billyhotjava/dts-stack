source:
  type: dbt
  serviceName: ${OPENMETADATA_DBT_SERVICE}
  sourceConfig:
    config:
      dbtConfigSource: local
      manifestPath: /opt/dbt/target/manifest.json
      runResultsPath: /opt/dbt/target/run_results.json
      catalogPath: /opt/dbt/target/catalog.json
sink:
  type: metadata-rest
  config:
    apiEndpoint: ${OPENMETADATA_API_ENDPOINT}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_AUTH_TOKEN}
workflowConfig:
  loggerLevel: INFO
