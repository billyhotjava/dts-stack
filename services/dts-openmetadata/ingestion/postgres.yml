source:
  type: postgres
  serviceName: ${OPENMETADATA_DB_SERVICE}
  serviceConnection:
    config:
      type: Postgres
      username: ${PG_SUPER_USER}
      authType:
        password: ${PG_SUPER_PASSWORD}
      hostPort: ${PG_HOST}:${PG_PORT}
      database: ${PG_DB_DTPS}
      sslMode: disable
  sourceConfig:
    config:
      type: DatabaseMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST_PORT}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_AUTH_TOKEN}
