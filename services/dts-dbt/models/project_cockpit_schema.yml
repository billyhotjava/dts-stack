version: 2

models:
  - name: pm_dim_major_project
    columns:
      - name: major_project_id
        tests:
          - not_null
          - unique
      - name: program_id
        tests:
          - not_null
      - name: major_project_name
        tests:
          - not_null

  - name: pm_dim_subproject
    columns:
      - name: subproject_id
        tests:
          - not_null
          - unique
      - name: major_project_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pm_dim_major_project')
                field: major_project_id

  - name: pm_dim_delay_reason
    columns:
      - name: delay_reason_category
        tests:
          - not_null
          - unique

  - name: pm_map_node_subject
    columns:
      - name: map_id
        tests:
          - not_null
          - unique
      - name: major_project_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pm_dim_major_project')
                field: major_project_id
      - name: subproject_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pm_dim_subproject')
                field: subproject_id
      - name: node_category
        tests:
          - accepted_values:
              arguments:
                values: ['milestone', 'critical', 'routine']
      - name: delay_reason_category
        tests:
          - accepted_values:
              arguments:
                values: ['normal', 'technical', 'quality', 'change', 'coordination', 'supplier', 'test', 'archive']

  - name: biz_dwd_project_node_enriched
    columns:
      - name: node_id
        tests:
          - not_null
          - unique
      - name: major_project_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pm_dim_major_project')
                field: major_project_id
      - name: subproject_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pm_dim_subproject')
                field: subproject_id
      - name: delay_reason_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['normal', 'technical', 'quality', 'change', 'coordination', 'supplier', 'test', 'archive']
      - name: node_status_bucket
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['closed-on-time', 'closed-delayed', 'overdue-open', 'risk-open', 'in-flight', 'planned']

  - name: biz_dws_week_subproject_summary
    columns:
      - name: subproject_id
        tests:
          - not_null
      - name: plan_iso_week
        tests:
          - not_null

  - name: biz_ads_major_project_overview
    columns:
      - name: major_project_id
        tests:
          - not_null
          - unique

  - name: biz_ads_major_project_tree_snapshot
    columns:
      - name: entity_id
        tests:
          - not_null
      - name: snapshot_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['major', 'subproject', 'node']

  - name: biz_ads_delay_reason_trend
    columns:
      - name: delay_reason_category
        tests:
          - not_null
      - name: plan_iso_week
        tests:
          - not_null
