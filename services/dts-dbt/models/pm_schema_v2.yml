version: 2

models:
  # ═══ DWD 维度表 ═══
  - name: dim_completion_status_v2
    description: "完成情况维度表（7种状态枚举）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_node_type_v2
    description: "节点类型维度表（一般/重要/重大/里程碑）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_risk_level_v2
    description: "风险等级维度表（高/中/低）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_quality_status_v2
    description: "质量归零状态维度表（4种状态）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_change_category_v2
    description: "更改类别维度表（I/II/III，含全角兼容）"

  - name: dim_signature_status_v2
    description: "文件签署状态维度表（5种状态，区分 I,II 类和 III 类）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_quality_category_v2
    description: "质量问题原因分类字典（9类：设计/工艺/管理/元器件/操作/外协/软件/环境/其他，含别名 外协外购→外协）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  - name: dim_risk_category_v2
    description: "风险类型字典（5类标准值：技术/进度/成本/设计/质量，含其他兜底）"
    columns:
      - name: code
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn

  # ═══ DWD 事实表 ═══
  - name: biz_dwd_project_node_v2
    description: "进度节点事实表 — ODS清洗+枚举标准化+日期解析"
    columns:
      - name: node_id
        tests:
          - not_null:
              severity: warn
      - name: project_no
        tests:
          - not_null:
              severity: warn
      - name: completion_status
        tests:
          - accepted_values:
              values: ['正常待完成', '按时完成', '超期已完成已变更', '超期已完成未变更',
                       '不正常待变更', '超期未完成未变更', '超期未完成已变更']
              severity: warn
      - name: node_type
        tests:
          - accepted_values:
              values: ['一般节点', '重要节点', '重大节点', '里程碑节点']
              severity: warn
      - name: risk_level
        tests:
          - accepted_values:
              values: ['高', '中', '低']
              severity: warn

  - name: biz_dwd_quality_issue_v2
    description: "质量问题事实表 — 归零状态+分类+计划标志"
    columns:
      - name: issue_id
        tests:
          - not_null:
              severity: warn
      - name: project_no
        tests:
          - not_null:
              severity: warn
      - name: status
        tests:
          - accepted_values:
              values: ['未完成归零', '已完成技术归零', '已完成管理归零', '已完成技术和管理归零']
              severity: warn
      - name: issue_category
        tests:
          - accepted_values:
              values: ['设计', '工艺', '管理', '元器件', '操作', '外协外购', '软件', '其他']
              severity: warn

  - name: biz_dwd_tech_state_v2
    description: "技术状态事实表 — 更改类别标准化+签署/整改状态"
    columns:
      - name: tech_state_id
        tests:
          - not_null:
              severity: warn
      - name: project_no
        tests:
          - not_null:
              severity: warn
      - name: change_category
        tests:
          - accepted_values:
              values: ['I', 'II', 'III']
              severity: warn

  - name: biz_dwd_risk_info_v2
    description: "风险事实表 — 风险台账清洗+等级标准化+释放标志"
    columns:
      - name: risk_id
        tests:
          - not_null:
              severity: warn
      - name: project_no
        tests:
          - not_null:
              severity: warn
      - name: risk_level
        tests:
          - accepted_values:
              values: ['高', '中', '低']
              severity: warn

  # ═══ DWS 汇总表 ═══
  - name: biz_dws_progress_monthly_v2
    description: "进度域月度汇总 — 按 project×month 聚合，对齐原始指标 #1-33"
    columns:
      - name: plan_month
        tests:
          - not_null:
              severity: warn

  - name: biz_dws_quality_monthly_v2
    description: "质量域月度汇总 — 按 project×dept×month 聚合，对齐原始指标 #34-48"
    columns:
      - name: period_month
        tests:
          - not_null:
              severity: warn

  - name: biz_dws_tech_state_monthly_v2
    description: "技术状态域月度汇总 — 按 project×dept×month 聚合，对齐原始指标 #49-67"
    columns:
      - name: period_month
        tests:
          - not_null:
              severity: warn

  - name: biz_dws_risk_monthly_v2
    description: "风险域月度汇总 — 按 project×dept×month 聚合"
    columns:
      - name: period_month
        tests:
          - not_null:
              severity: warn

  # ═══ ADS 原始指标 (kpi) ═══
  - name: biz_ads_progress_kpi_v2
    description: "进度域原始指标 — 33个指标月度聚合，含分子/分母"

  - name: biz_ads_quality_kpi_v2
    description: "质量域原始指标 — 15个指标月度聚合"

  - name: biz_ads_tech_state_kpi_v2
    description: "技术状态域原始指标 — 19个指标月度聚合"

  - name: biz_ads_risk_kpi_v2
    description: "风险域KPI — 风险总数/高中低/释放率月度聚合"

  # ═══ ADS 二次指标 (derived) ═══
  - name: biz_ads_progress_derived_v2
    description: "进度域二次指标 — 6个（按时完成率/超期率/异常率/里程碑率/高风险占比/健康分）"

  - name: biz_ads_quality_derived_v2
    description: "质量域二次指标 — 5个（归零率/现存率/计划提交率/设计类占比/健康分）"

  - name: biz_ads_tech_state_derived_v2
    description: "技术状态域二次指标 — 5个（签署率/整改率/I类占比/未签署率/健康分）"

  - name: biz_ads_composite_derived_v2
    description: "综合域二次指标 — 2个（项目综合健康度/风险预警指数）"
