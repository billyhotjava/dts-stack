version: 2

models:
  # ═══════════════════════════════════════════════════════════════
  #  执行域 — 已迁移到 project_cockpit_schema.yml:
  #    pm_dim_major_project, pm_dim_subproject, pm_map_node_subject,
  #    biz_dwd_project_node_enriched, biz_dws_week_subproject_summary,
  #    biz_ads_major_project_overview, biz_ads_major_project_tree_snapshot,
  #    biz_ads_delay_reason_trend, pm_dim_delay_reason
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  #  质量域 — DWD
  # ═══════════════════════════════════════════════════════════════

  - name: dim_quality_status
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }

  - name: dim_change_category
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }

  - name: dim_signature_status
    columns:
      - name: code
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }

  - name: biz_dwd_quality_issue
    columns:
      - name: issue_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: issue_category
        tests:
          - accepted_values:
              config: { severity: warn }
              arguments:
                values: ['设计', '工艺', '管理', '元器件', '操作', '外协外购', '软件', '其他']

  - name: biz_dwd_quality_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  技术状态域 — DWD
  # ═══════════════════════════════════════════════════════════════

  - name: biz_dwd_tech_state
    columns:
      - name: tech_state_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: change_category
        tests:
          - accepted_values:
              config: { severity: warn }
              arguments:
                values: ['I', 'II', 'III']

  - name: biz_dwd_tech_state_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  风险域 — DWD
  # ═══════════════════════════════════════════════════════════════

  - name: biz_dwd_risk_info
    columns:
      - name: risk_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
      - name: risk_level
        tests:
          - accepted_values:
              config: { severity: warn }
              arguments:
                values: ['高', '中', '低']

  - name: biz_dwd_risk_measure
    columns:
      - name: risk_measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  质量/技术状态/风险 — DWS
  # ═══════════════════════════════════════════════════════════════

  - name: biz_dws_quality_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_tech_state_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_risk_period_summary
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  质量/技术状态/风险 — ADS
  # ═══════════════════════════════════════════════════════════════

  - name: biz_ads_quality_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_tech_state_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_risk_kpi
    columns:
      - name: period_year
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  物料域
  # ═══════════════════════════════════════════════════════════════

  - name: biz_dwd_material_info
    columns:
      - name: material_id
        tests:
          - not_null: { config: { severity: warn } }
          - unique: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_material_period_summary
    columns:
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_ads_material_kpi
    columns:
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  # ═══════════════════════════════════════════════════════════════
  #  进度跟进域
  # ═══════════════════════════════════════════════════════════════

  - name: biz_dwd_progress_measure
    columns:
      - name: measure_id
        tests:
          - not_null: { config: { severity: warn } }
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }

  - name: biz_dws_progress_measure_summary
    columns:
      - name: project_no
        tests:
          - not_null: { config: { severity: warn } }
