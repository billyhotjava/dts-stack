# Minimal dynamic config to satisfy --providers.file.filename
# Keep lightweight; service-specific routers/middlewares are defined via labels.

http:
  routers:
    # Fallback routers for Hetu reverse-proxy paths.
    # These are defined in file-provider so they still work even if Docker label routers fail to load.
    # They intentionally match by path only (no Host constraint) and use slightly lower priorities than
    # the docker-label routers, so in normal setups the Host-scoped routers win.
    hetu-dashboards-fallback:
      rule: PathPrefix(`/dashboards`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-strip-dashboards
        - hetu-allow-anonymous
        - security-headers
      priority: 199
      tls: {}

    hetu-dashboard-hetu-fallback:
      rule: PathPrefix(`/dashboard/hetu`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-strip-dashboard-hetu
        - hetu-allow-anonymous
        - security-headers
      priority: 209
      tls: {}

    hetu-screen-fallback:
      rule: PathPrefix(`/screen`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 189
      tls: {}

    hetu-system-fallback:
      rule: PathPrefix(`/system`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 184
      tls: {}

    hetu-tdv-fallback:
      rule: PathPrefix(`/tdv`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 219
      tls: {}

    hetu-account-fallback:
      rule: PathPrefix(`/account`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 185
      tls: {}

    hetu-hetu-fallback:
      rule: PathPrefix(`/hetu`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 184
      tls: {}

    hetu-static-fallback:
      rule: PathPrefix(`/static`)
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 194
      tls: {}

    hetu-root-assets-fallback:
      rule: (PathPrefix(`/core`) || PathPrefix(`/screen-`) || PathPrefix(`/default~`) || PathPrefix(`/vendors~`) || PathPrefix(`/runtime~`))
      entryPoints:
        - websecure
      service: hetu
      middlewares:
        - hetu-allow-anonymous
        - security-headers
      priority: 204
      tls: {}

  services:
    # Hetu BI (external process on the same host).
    # Note: this points to the Docker host; if you deploy Hetu as a container,
    # change the URL to something like http://dts-hetu:7778 and join `dts-core`.
    hetu:
      loadBalancer:
        # Allow request middlewares to set an explicit upstream Host header.
        #
        # We rely on the docker-label middleware `hetu-upstream-host@docker` to rewrite:
        #   Host / X-Forwarded-* => ${HETU_UPSTREAM_IP}:7778
        #
        # If `passHostHeader` is false, Traefik will overwrite Host to `hetu.upstream:7778`
        # after middlewares, and some Hetu installs respond 404 for unexpected Host values.
        passHostHeader: true
        servers:
          # NOTE: file-provider has no env interpolation. We use a fixed hostname and bind it via
          # `extra_hosts` on `dts-proxy` to the env-driven `HETU_UPSTREAM_IP` (generated by `init.sh` into `.env`).
          - url: "http://hetu.upstream:7778"
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: false
    # Forward-auth to platform: reuse platform login/session for downstream modules (e.g. analytics).
    # This validates incoming requests (Authorization: Bearer <portal access token>) and injects identity
    # headers (X-DTS-*) into downstream requests on success.
    platform-forward-auth:
      forwardAuth:
        address: "http://dts-platform:8081/api/forward-auth"
        trustForwardHeader: true
        authRequestHeaders:
          - Authorization
          - Cookie
        authResponseHeaders:
          - X-DTS-User
          - X-DTS-Display-Name
          - X-DTS-User-Id
          - X-DTS-Roles
          - X-DTS-Permissions
          - X-DTS-Dept-Code
          - X-DTS-Personnel-Level
    hetu-allow-anonymous:
      headers:
        customRequestHeaders:
          tui-allow-anonymous: "true"
    hetu-strip-dashboards:
      stripPrefixRegex:
        regex:
          - "/dashboards"
    hetu-strip-dashboard-hetu:
      stripPrefixRegex:
        regex:
          - "/dashboard/hetu"
    # CORS middleware for APIs (auto-match any origin; rely on same-origin routing for safety)
    cors-allow:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        addVaryHeader: true
        accessControlAllowCredentials: true
        # Auto-match any origin (works with allowCredentials=true since Traefik reflects the matched origin)
        accessControlAllowOriginListRegex:
          - "https?://.*"
        accessControlMaxAge: 86400

tls:
  certificates:
    - certFile: /certs/server.crt
      keyFile: /certs/server.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
  stores:
    default:
      defaultCertificate:
        certFile: /certs/server.crt
        keyFile: /certs/server.key
