# Minimal dynamic config to satisfy --providers.file.filename
# Keep lightweight; service-specific routers/middlewares are defined via labels.

http:
  services:
    # Hetu BI (external process on the same host).
    # Note: this points to the Docker host; if you deploy Hetu as a container,
    # change the URL to something like http://dts-hetu:7778 and join `dts-core`.
    hetu:
      loadBalancer:
        # Do NOT forward the incoming Host (bi.*) to Hetu; some Hetu installs return 404 when Host is unexpected.
        # With `passHostHeader: false`, Traefik will set Host to the upstream host (host.docker.internal:7778).
        passHostHeader: false
        servers:
          - url: "http://192.168.100.10:7778"
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: false
    # CORS middleware for APIs (auto-match any origin; rely on same-origin routing for safety)
    cors-allow:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        addVaryHeader: true
        accessControlAllowCredentials: true
        # Auto-match any origin (works with allowCredentials=true since Traefik reflects the matched origin)
        accessControlAllowOriginListRegex:
          - "https?://.*"
        accessControlMaxAge: 86400

tls:
  certificates:
    - certFile: /certs/server.crt
      keyFile: /certs/server.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
  stores:
    default:
      defaultCertificate:
        certFile: /certs/server.crt
        keyFile: /certs/server.key
