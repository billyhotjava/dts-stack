version: "3.9"

services:
  dts-analytics:
    # NOTE: keep interpolation simple for legacy docker-compose compatibility (avoid nested ${...${...}}).
    image: ${IMAGE_DTS_ANALYTICS:-dts-analytics:1.0.0}
    container_name: dts-analytics
    restart: unless-stopped
    depends_on:
      - dts-pg
    env_file:
      - ./metabase.env
    volumes:
      - ./plugins:/plugins
      - ./data:/metabase-data
      - ./logs:/var/log/metabase
      - ../certs:/certs:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  dts-pg:
    image: ${IMAGE_POSTGRES:-postgres:17.6}
    container_name: dts-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: dts_analytics
      POSTGRES_USER: dts_analytics
      POSTGRES_PASSWORD: dts_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
