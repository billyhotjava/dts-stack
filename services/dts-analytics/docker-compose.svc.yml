version: "3.9"

services:
  dts-analytics:
    # Java rewrite image (see ./Dockerfile).
    # NOTE: keep interpolation simple for legacy docker-compose compatibility (avoid nested ${...${...}}).
    image: ${IMAGE_DTS_ANALYTICS:-dts-analytics:local}
    container_name: dts-analytics
    restart: unless-stopped
    depends_on:
      - dts-pg
    environment:
      SPRING_DATASOURCE_URL: ${ANALYTICS_DB_URL:-jdbc:postgresql://dts-pg:5432/dts_analytics}
      SPRING_DATASOURCE_USERNAME: ${ANALYTICS_DB_USER:-dts_analytics}
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-dts_analytics}
    volumes:
      - ./plugins:/plugins
      - ./data:/data
      - ./logs:/var/log/dts-analytics
      - ../certs:/certs:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  dts-pg:
    image: ${IMAGE_POSTGRES:-postgres:17.6}
    container_name: dts-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: dts_analytics
      POSTGRES_USER: dts_analytics
      POSTGRES_PASSWORD: dts_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
