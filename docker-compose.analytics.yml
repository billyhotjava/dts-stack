## Optional: Analytics service (disabled by default).
##
## Enable when needed:
##   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.analytics.yml up -d dts-analytics
## Legacy:
##   docker-compose -f docker-compose.legacy.yml -f docker-compose.analytics.yml up -d dts-analytics

services:
  dts-analytics:
    # Java rewrite image (see services/dts-analytics/Dockerfile).
    # NOTE: keep interpolation simple for legacy docker-compose compatibility (avoid nested ${...${...}}).
    image: ${IMAGE_DTS_ANALYTICS:-dts-analytics:local}
    depends_on:
      dts-pg:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${ANALYTICS_JAVA_TOOL_OPTIONS:-}
      SPRING_DATASOURCE_URL: ${ANALYTICS_DB_URL:-jdbc:postgresql://dts-pg:5432/dts_analytics}
      SPRING_DATASOURCE_USERNAME: ${ANALYTICS_DB_USER:-dts_analytics}
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-dts_analytics}
    volumes:
      - ./services/dts-analytics/plugins:/plugins:Z
      - ./services/dts-analytics/data:/data:Z
      - ./services/dts-analytics/logs:/var/log/dts-analytics:Z
      - ./services/certs:/certs:ro,z
    restart: unless-stopped
    networks:
      - dts-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dts-core"
      - "traefik.http.routers.dts-analytics.rule=Host(`${HOST_ANALYTICS}`)"
      - "traefik.http.routers.dts-analytics.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics.tls=true"
      - "traefik.http.routers.dts-analytics.middlewares=security-headers@file"
      - "traefik.http.services.dts-analytics.loadbalancer.server.port=3000"
      - "traefik.http.routers.dts-analytics-path.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/analytics`)"
      - "traefik.http.routers.dts-analytics-path.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics-path.tls=true"
      - "traefik.http.routers.dts-analytics-path.priority=180"
      - "traefik.http.routers.dts-analytics-path.service=dts-analytics"
      - "traefik.http.middlewares.analytics-strip-analytics.stripprefixregex.regex=/analytics"
      - "traefik.http.middlewares.analytics-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/analytics"
      - "traefik.http.routers.dts-analytics-path.middlewares=analytics-strip-analytics@docker,analytics-prefix@docker,security-headers@file"
