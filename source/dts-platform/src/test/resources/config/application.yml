# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

eureka:
  client:
    enabled: false
  instance:
    appname: dtsPlatform
    instanceId: dtsPlatform:${spring.application.instance-id:${random.value}}

spring:
  application:
    name: dtsPlatform
  cloud:
    config:
      enabled: false
  liquibase:
    contexts: test
  jackson:
    serialization:
      write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: test-client
            client-secret: test-secret
            scope: openid,profile,email
        provider:
          oidc:
            issuer-uri: http://do-not-call:9080/realms/jhipster
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
  task:
    execution:
      thread-name-prefix: dts-platform-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: dts-platform-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

auditing:
  tenancy-mode: SINGLE_TENANT
  tenant-id: test

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'dtsPlatformApp'
  mail:
    from: dtsPlatform@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

# Dummy signing secret for IT bootstrap — production sets DATA_STANDARD_ENCRYPTION_KEY.
# Both PkiSessionTicketService and PortalSessionCookieService fall back to this key,
# so without it every IT context refresh fails on bean instantiation.
DATA_STANDARD_ENCRYPTION_KEY: dGVzdC1pbnRlZ3JhdGlvbi1lbmNyeXB0aW9uLWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
