# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
eureka:
  client:
    enabled: true
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
  instance:
    appname: dtsplatform
    instanceId: dtsplatform:${spring.application.instance-id:${random.value}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    status-page-url-path: ${management.endpoints.web.base-path}/info
    health-check-url-path: ${management.endpoints.web.base-path}/health
    metadata-map:
      zone: primary # This is needed for the load balancer
      profile: ${spring.profiles.active}
      version: '@project.version@'
      git-version: ${git.commit.id.describe:}
      git-commit: ${git.commit.id.abbrev:}
      git-branch: ${git.branch:}
      context-path: ${server.servlet.context-path:}
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: dtsPlatform
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/postgresql.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      # Leave Instant mapping to Hibernate defaults to avoid incubating setting warnings
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
      hibernate.cache.region.factory_class: com.hazelcast.hibernate.HazelcastCacheRegionFactory
      hibernate.cache.use_minimal_puts: true
      hibernate.cache.hazelcast.instance_name: dtsPlatform
      hibernate.cache.hazelcast.use_lite_member: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${DATA_STANDARD_MAX_FILE_SIZE:209715200}
      max-request-size: ${DATA_STANDARD_MAX_FILE_SIZE:209715200}
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://dts-keycloak:8080/realms/S10
        registration:
          oidc:
            client-id: ${OAUTH2_PLATFORM_CLIENT_ID:internal}
            client-secret: ${OAUTH2_PLATFORM_CLIENT_SECRET:internal}
            scope: openid, profile, email, offline_access # last one for refresh tokens
  kafka:
    bootstrap-servers: ${DTS_KAFKA_BOOTSTRAP_SERVERS:dts-kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  task:
    execution:
      thread-name-prefix: dts-platform-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: dts-platform-scheduling-
      pool:
        size: 2
logging:
  level:
    com.yuzhi.dts.platform.service.security.AccessChecker: DEBUG
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      host-header: x-forwarded-host
      internal-proxies: ${DTS_TRUSTED_PROXY_REGEX:.*}
  undertow:
    max-http-form-post-size: ${DATA_STANDARD_MAX_FILE_SIZE:209715200}
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

dts:
  dbt:
    enabled: ${DTS_DBT_ENABLED:true}
    config-path: ${DTS_DBT_CONFIG_PATH:/opt/dts/upload/dbt-config.json}
    project-dir: ${DTS_DBT_PROJECT_DIR:/opt/dts/dbt}
    profiles-dir: ${DTS_DBT_PROFILES_DIR:/opt/dts/dbt-profiles}
    release-gate:
      require-git-metadata: ${DTS_DBT_RELEASE_GATE_REQUIRE_GIT_METADATA:false}
  airflow:
    enabled: ${DTS_AIRFLOW_ENABLED:true}
    base-url: ${DTS_AIRFLOW_BASE_URL:http://dts-airflow-webserver:8080}
    username: ${DTS_AIRFLOW_USERNAME:airflow}
    password: ${DTS_AIRFLOW_PASSWORD:airflow}
    dag-id: ${DTS_AIRFLOW_DAG_ID:dbt_load}
    dags-dir: ${DTS_AIRFLOW_DAGS_DIR:/opt/airflow/dags}
    dag-ready-wait-seconds: ${DTS_AIRFLOW_DAG_READY_WAIT_SECONDS:15}
    dag-ready-poll-seconds: ${DTS_AIRFLOW_DAG_READY_POLL_SECONDS:2}
  ingestion:
    enabled: ${DTS_INGESTION_ENABLED:true}
    base-url: ${DTS_INGESTION_BASE_URL:http://dts-ingestion:8083}
    service-name: ${DTS_INGESTION_SERVICE_NAME:dts-platform}
    retry:
      max-attempts: ${DTS_INGESTION_RETRY_MAX_ATTEMPTS:3}
      wait-duration-ms: ${DTS_INGESTION_RETRY_WAIT_MS:1000}
      multiplier: ${DTS_INGESTION_RETRY_MULTIPLIER:2.0}
    circuit-breaker:
      failure-rate-threshold: ${DTS_INGESTION_CB_FAILURE_RATE:50}
      sliding-window-size: ${DTS_INGESTION_CB_WINDOW_SIZE:10}
      wait-duration-in-open-state-seconds: ${DTS_INGESTION_CB_OPEN_WAIT:30}
      permitted-calls-in-half-open-state: ${DTS_INGESTION_CB_HALF_OPEN_CALLS:3}
  # @deprecated Sprint-28 起,本段仅作为旧 env 兼容入口。
  # 出站语义已迁至 dts.platform.outbound.admin.*; 入站语义已迁至 dts.platform.inbound.service-auth.*。
  # Sprint-29 计划移除该段及对应 env(DTS_ADMIN_*),请尽快切换到新 env。
  admin:
    enabled: ${DTS_ADMIN_ENABLED:true}
    base-url: ${DTS_ADMIN_BASE_URL:http://dts-admin:8081}
    api-path: ${DTS_ADMIN_API_PATH:/api}
    admin-api-path: ${DTS_ADMIN_ADMIN_API_PATH:/api/admin}
    service-token: ${DTS_ADMIN_SERVICE_TOKEN:}
    service-name: ${DTS_ADMIN_SERVICE_NAME:dts-admin,dts-ingestion,dts-airflow,dts-analytics}
  sql-ide:
    v2:
      enabled: ${DTS_SQL_IDE_V2_ENABLED:false}
  platform:
    # Sprint-28 新增:出站客户端配置(platform 调 dts-admin)
    outbound:
      admin:
        enabled: ${DTS_PLATFORM_OUTBOUND_ADMIN_ENABLED:${DTS_ADMIN_ENABLED:true}}
        base-url: ${DTS_PLATFORM_OUTBOUND_ADMIN_BASE_URL:${DTS_ADMIN_BASE_URL:http://dts-admin:8081}}
        api-path: ${DTS_PLATFORM_OUTBOUND_ADMIN_API_PATH:${DTS_ADMIN_API_PATH:/api}}
        admin-api-path: ${DTS_PLATFORM_OUTBOUND_ADMIN_ADMIN_API_PATH:${DTS_ADMIN_ADMIN_API_PATH:/api/admin}}
        service-token: ${DTS_PLATFORM_TO_ADMIN_TOKEN:${DTS_ADMIN_SERVICE_TOKEN:}}
        # platform 出站时通过 X-DTS-Service header 自报的服务名,默认 dts-platform。
        # 注:Sprint-27 之前误用入站白名单字符串(dts-admin,dts-ingestion,...) 作为出站身份,Sprint-28 拆分时修复。
        service-name: ${DTS_PLATFORM_OUTBOUND_SERVICE_NAME:dts-platform}
    # Sprint-28 新增:入站服务鉴权配置(谁能调 platform)
    inbound:
      service-auth:
        enabled: ${DTS_PLATFORM_INBOUND_AUTH_ENABLED:true}
        # F2 之前,所有受信服务统一校验此 secret。F2 起优先用 trusted-services Map 内的独立 secret。
        shared-secret: ${DTS_PLATFORM_INBOUND_SHARED_SECRET:${DTS_ADMIN_SERVICE_TOKEN:}}
        # 入站白名单。逗号分隔字符串会被 Spring 自动转 List。
        trusted-service-names: ${DTS_PLATFORM_INBOUND_TRUSTED_SERVICES:${DTS_ADMIN_SERVICE_NAME:dts-admin,dts-ingestion,dts-airflow,dts-analytics,dts-metrics}}
        # 每对独立 secret(Sprint-28 F2 起启用)。
        # 单独的 DTS_INBOUND_FROM_<SERVICE> 优先;未设时 fallback 到 DTS_ADMIN_SERVICE_TOKEN,
        # 若仍为空,会进一步 fallback 到 shared-secret(运维仅迁移到一半时不至于全断)。
        trusted-services:
          dts-ingestion: ${DTS_INBOUND_FROM_INGESTION:${DTS_ADMIN_SERVICE_TOKEN:}}
          dts-airflow:   ${DTS_INBOUND_FROM_AIRFLOW:${DTS_ADMIN_SERVICE_TOKEN:}}
          dts-analytics: ${DTS_INBOUND_FROM_ANALYTICS:${DTS_ADMIN_SERVICE_TOKEN:}}
          dts-metrics:   ${DTS_INBOUND_FROM_METRICS:${DTS_ADMIN_SERVICE_TOKEN:}}
        # 兼容开关:开启后退回 Sprint-27 行为(仅 X-DTS-Service header 即注入 OP_ADMIN)。production 严禁开启。
        legacy-header-only-mode: ${DTS_PLATFORM_LEGACY_HEADER_ONLY_MODE:false}
    events:
      kafka:
        enabled: ${DTS_PLATFORM_EVENTS_KAFKA_ENABLED:false}
        topic: ${DTS_PLATFORM_EVENTS_KAFKA_TOPIC:dts.platform.events}
        batch-size: ${DTS_PLATFORM_EVENTS_KAFKA_BATCH_SIZE:50}
        dispatch-interval-ms: ${DTS_PLATFORM_EVENTS_KAFKA_DISPATCH_INTERVAL_MS:10000}
    features:
      # Serve Keycloak localization resources from platform to avoid browser TLS trust issues to admin domain in dev
      kc-localization: ${DTS_FEATURE_PLATFORM_KC_LOCALIZATION:true}
    openmetadata:
      enabled: ${DTS_PLATFORM_OPENMETADATA_ENABLED:true}
      base-url: ${DTS_PLATFORM_OPENMETADATA_BASE_URL:http://dts-openmetadata:8585}
      api-path: ${DTS_PLATFORM_OPENMETADATA_API_PATH:/api/v1}
      ui-base-url: ${DTS_PLATFORM_OPENMETADATA_UI_BASE_URL:}
      auth-token: ${DTS_PLATFORM_OPENMETADATA_AUTH_TOKEN:}
      service-name: ${DTS_PLATFORM_OPENMETADATA_SERVICE_NAME:hive}
      default-database: ${DTS_PLATFORM_OPENMETADATA_DEFAULT_DATABASE:}
      default-schema: ${DTS_PLATFORM_OPENMETADATA_DEFAULT_SCHEMA:}
      table-fqn-pattern: ${DTS_PLATFORM_OPENMETADATA_TABLE_FQN_PATTERN:{service}.{database}.{table}}
      table-fields: ${DTS_PLATFORM_OPENMETADATA_TABLE_FIELDS:columns,owner,tags,domain,usageSummary,profile}
    session:
      timeout-minutes: ${DTS_PLATFORM_SESSION_TIMEOUT_MINUTES:30}
    hive:
      enabled: false
      jdbc-url: jdbc:hive2://dts-hive:10000/default
      username: ""
      password: ""
      tolerant: true
    catalog:
      # Enable Hive(Inceptor) metadata sync by default so datasets appear once a data source is published.
      inceptor-sync-enabled: ${DTS_PLATFORM_CATALOG_INCEPTOR_SYNC_ENABLED:true}
      postgres-schema: OLAP
      properties: {}
  jdbc:
    # Directory to search for external JDBC drivers (jar files) at runtime.
    # Place vendor-provided drivers here (e.g., TDS/Inceptor client jars).
    drivers-dir: /opt/dts/drivers
    # Whether to enable loading JDBC drivers from the external directory above.
    # Enabled by default now to use vendor driver and avoid Hadoop conflicts.
    load-external-drivers: true
    # Optional: specify a concrete driver class to load/register (e.g., org.apache.hive.jdbc.HiveDriver).
    # If unset, the loader will try ServiceLoader and known fallback classes.
    driver-class: 
    # Optional: specify a particular jar file name or absolute path to load, instead of scanning the directory.
    # Example: inceptor-driver-8.37.3.jar or /opt/dts/drivers/inceptor-driver-8.37.3.jar
    driver-jar: 

