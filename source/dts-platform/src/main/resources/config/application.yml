---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

auditing:
  enabled: true
  outbox:
    dispatch-delay-ms: ${AUDIT_OUTBOX_DISPATCH_DELAY_MS:2000}
    batch-size: ${AUDIT_OUTBOX_BATCH_SIZE:100}
    max-dispatch-cycle-seconds: ${AUDIT_OUTBOX_MAX_DISPATCH_CYCLE_SECONDS:30}
    stale-claim-seconds: ${AUDIT_OUTBOX_STALE_CLAIM_SECONDS:120}
    initial-retry-seconds: ${AUDIT_OUTBOX_INITIAL_RETRY_SECONDS:5}
    max-retry-seconds: ${AUDIT_OUTBOX_MAX_RETRY_SECONDS:300}
    max-attempts: ${AUDIT_OUTBOX_MAX_ATTEMPTS:20}
    retention-days: ${AUDIT_OUTBOX_RETENTION_DAYS:180}
    retention-batch-size: ${AUDIT_OUTBOX_RETENTION_BATCH_SIZE:5000}
    retention-cron: ${AUDIT_OUTBOX_RETENTION_CRON:0 20 2 * * *}
  dictionary:
    # HMAC verification of legacy-action-mappings.json. When verify-signatures=true and hmac-key
    # is empty, audit dictionary loading fails closed — intentional fail-secure behaviour.
    # The HMAC key MUST be held by the authorization administrator (authadmin), not the platform
    # system administrator. See dts-admin/.../AuditDictionaryProperties for parallel admin-side config.
    verify-signatures: ${AUDIT_DICT_VERIFY_SIG:false}
    hmac-key: ${AUDIT_DICT_HMAC_KEY:}
    legacy-keys: ${AUDIT_DICT_HMAC_LEGACY_KEYS:}
    signature-suffix: ${AUDIT_DICT_SIG_SUFFIX:.sig}

dts:
  platform:
    modeling:
      default-tenant-id: ${DTS_PLATFORM_MODELING_DEFAULT_TENANT_ID:default}
    infra:
      multi-source-enabled: ${DTS_PLATFORM_INFRA_MULTI_SOURCE_ENABLED:false}
      encryption-key: ${DTS_INFRA_ENCRYPTION_KEY:${DATA_STANDARD_ENCRYPTION_KEY:}}
      key-version: ${DTS_INFRA_KEY_VERSION:${DATA_STANDARD_KEY_VERSION:v1}}
    data-standard:
      encryption-key: ${DATA_STANDARD_ENCRYPTION_KEY:}
      key-version: ${DATA_STANDARD_KEY_VERSION:v1}
      attachment:
        max-file-size: ${DATA_STANDARD_MAX_FILE_SIZE:209715200}
        allowed-extensions: docx,wps,pdf,xlsx,xls,md,txt
        storage-strategy: ${DATA_STANDARD_ATTACHMENT_STORAGE_STRATEGY:filesystem}
        storage-dir: ${DATA_STANDARD_STORAGE_DIR:/opt/dts/upload}
    governance:
      quality:
        enabled: ${DTS_GOVERNANCE_QUALITY_ENABLED:true}
        default-executor: ${DTS_GOVERNANCE_QUALITY_EXECUTOR:hive}
        max-concurrent: ${DTS_GOVERNANCE_QUALITY_MAX_CONCURRENT:5}
        retry-count: ${DTS_GOVERNANCE_QUALITY_RETRY:1}
        timeout: ${DTS_GOVERNANCE_QUALITY_TIMEOUT:PT10M}
        auto-generate-ticket: ${DTS_GOVERNANCE_QUALITY_AUTOTICKET:true}
        task-scheduler-delay-ms: ${DTS_GOVERNANCE_QUALITY_TASK_SCHEDULER_DELAY_MS:60000}
      compliance:
        enabled: ${DTS_GOVERNANCE_COMPLIANCE_ENABLED:true}
        evidence-required-default: ${DTS_GOVERNANCE_COMPLIANCE_EVIDENCE:true}
        auto-ticket: ${DTS_GOVERNANCE_COMPLIANCE_AUTOTICKET:true}
        sla: ${DTS_GOVERNANCE_COMPLIANCE_SLA:P7D}
      issue:
        default-assignee: ${DTS_GOVERNANCE_ISSUE_ASSIGNEE:}
        default-priority: ${DTS_GOVERNANCE_ISSUE_PRIORITY:MEDIUM}
        reminder-interval: ${DTS_GOVERNANCE_ISSUE_REMINDER:P3D}
        auto-close-after: ${DTS_GOVERNANCE_ISSUE_AUTOCLOSE:P30D}
      datasource:
        primary: ${DTS_GOVERNANCE_PRIMARY_SOURCE:foundation-hive}
        allow-multiple: ${DTS_GOVERNANCE_ALLOW_MULTIPLE:false}
        optional-sources: ${DTS_GOVERNANCE_OPTIONAL_SOURCES:}
