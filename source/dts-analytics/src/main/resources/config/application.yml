spring:
  application:
    name: dts-analytics
  main:
    banner-mode: "off"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PG_HOST:dts-pg}:${PG_PORT:5432}/${PG_DB_ANALYTICS:dts_analytics}}
    username: ${SPRING_DATASOURCE_USERNAME:${PG_USER_ANALYTICS:dts_analytics}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PG_PWD_ANALYTICS:dts_analytics}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.naming.physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      hibernate.naming.implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  liquibase:
    change-log: classpath:config/liquibase/master.xml

server:
  port: 3000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,text/javascript
    min-response-size: 1024

application:
  service:
    name: dts-analytics
    version: 2.2.3-SNAPSHOT
    environment: dev

analytics:
  bi-features:
    governed-bi-enabled: ${DTS_ANALYTICS_GOVERNED_BI_ENABLED:true}
    legacy-card-write-enabled: ${DTS_ANALYTICS_LEGACY_CARD_WRITE_ENABLED:true}
  local-iam:
    read-only: ${ANALYTICS_LOCAL_IAM_READ_ONLY:true}
  public-sharing:
    enabled: ${ANALYTICS_PUBLIC_SHARING_ENABLED:false}
  query-budget:
    user-concurrency: ${ANALYTICS_QUERY_USER_CONCURRENCY:3}
    department-concurrency: ${ANALYTICS_QUERY_DEPARTMENT_CONCURRENCY:20}
    global-concurrency: ${ANALYTICS_QUERY_GLOBAL_CONCURRENCY:100}

dts:
  analytics:
    inbound:
      platform:
        service-token: ${DTS_ANALYTICS_INBOUND_FROM_PLATFORM_TOKEN:}
    screen-permission:
      platform-source-enabled: ${DTS_ANALYTICS_SCREEN_PERMISSION_PLATFORM_SOURCE_ENABLED:true}
      local-fallback-enabled: ${DTS_ANALYTICS_SCREEN_PERMISSION_LOCAL_FALLBACK_ENABLED:true}
      local-write-enabled: ${DTS_ANALYTICS_SCREEN_PERMISSION_LOCAL_WRITE_ENABLED:false}
    jdbc:
      drivers-dir: ${ANALYTICS_JDBC_DRIVERS_DIR:}
    # @deprecated Sprint-28 起 dts.analytics.platform.* 仅作为旧 env 兼容入口,
    # 新代码使用 dts.analytics.outbound.platform.*(见下方),Sprint-29 移除此段。
    platform:
      base-url: ${DTS_ANALYTICS_PLATFORM_BASE_URL:http://dts-platform:8081}
      api-path: ${DTS_ANALYTICS_PLATFORM_API_PATH:/api}
      service-name: ${DTS_ANALYTICS_PLATFORM_SERVICE_NAME:dts-analytics}
      timeout-seconds: ${DTS_ANALYTICS_PLATFORM_TIMEOUT_SECONDS:10}
    # Sprint-28 F5 新增:出站客户端配置(analytics 调 platform)
    outbound:
      platform:
        enabled: ${DTS_ANALYTICS_OUTBOUND_PLATFORM_ENABLED:true}
        base-url: ${DTS_ANALYTICS_OUTBOUND_PLATFORM_BASE_URL:${DTS_ANALYTICS_PLATFORM_BASE_URL:http://dts-platform:8081}}
        api-path: ${DTS_ANALYTICS_OUTBOUND_PLATFORM_API_PATH:${DTS_ANALYTICS_PLATFORM_API_PATH:/api}}
        # 三级 fallback: 新独立 env -> 旧 admin env(因为部署历史曾共用)-> 空
        service-token: ${DTS_ANALYTICS_TO_PLATFORM:${DTS_ADMIN_SERVICE_TOKEN:}}
        service-name: ${DTS_ANALYTICS_OUTBOUND_SERVICE_NAME:${DTS_ANALYTICS_PLATFORM_SERVICE_NAME:dts-analytics}}
        timeout-seconds: ${DTS_ANALYTICS_OUTBOUND_PLATFORM_TIMEOUT_SECONDS:${DTS_ANALYTICS_PLATFORM_TIMEOUT_SECONDS:10}}
    platform-auth:
      enabled: ${DTS_ANALYTICS_PLATFORM_AUTH_ENABLED:true}
      require-forwarded-headers: ${DTS_ANALYTICS_PLATFORM_AUTH_REQUIRE_FORWARDED_HEADERS:true}
      email-domain: ${DTS_ANALYTICS_PLATFORM_AUTH_EMAIL_DOMAIN:platform.local}
      allow-bearer-fallback: ${DTS_ANALYTICS_PLATFORM_AUTH_ALLOW_BEARER_FALLBACK:true}
    oidc:
      enabled: ${DTS_ANALYTICS_OIDC_ENABLED:false}
      issuer-uri: ${DTS_ANALYTICS_OIDC_ISSUER_URI:}
      client-id: ${DTS_ANALYTICS_OIDC_CLIENT_ID:}
      client-secret: ${DTS_ANALYTICS_OIDC_CLIENT_SECRET:}
      admin-role: ${DTS_ANALYTICS_OIDC_ADMIN_ROLE:analytics-admin}
    project-cockpit:
      warehouse:
        enabled: ${DTS_ANALYTICS_PROJECT_COCKPIT_WAREHOUSE_ENABLED:false}
        url: ${DTS_ANALYTICS_PROJECT_COCKPIT_WAREHOUSE_URL:jdbc:postgresql://${PG_HOST:dts-pg}:${PG_PORT:5432}/${PG_DB_BIADMIN:biadmin}}
        username: ${DTS_ANALYTICS_PROJECT_COCKPIT_WAREHOUSE_USERNAME:${PG_USER_BIADMIN:biadmin}}
        password: ${DTS_ANALYTICS_PROJECT_COCKPIT_WAREHOUSE_PASSWORD:${PG_PWD_BIADMIN:}}
        driver-class-name: ${DTS_ANALYTICS_PROJECT_COCKPIT_WAREHOUSE_DRIVER:org.postgresql.Driver}
  admin:
    enabled: ${DTS_ADMIN_ENABLED:true}
    base-url: ${DTS_ADMIN_BASE_URL:http://dts-admin:8081}
    api-path: ${DTS_ADMIN_API_PATH:/api}
    service-token: ${DTS_ANALYTICS_TO_ADMIN_TOKEN:${DTS_PLATFORM_TO_ADMIN_TOKEN:${DTS_ADMIN_SERVICE_TOKEN:}}}
    service-name: ${DTS_ADMIN_SERVICE_NAME:dts-analytics}
