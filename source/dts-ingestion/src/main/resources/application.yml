server:
  port: 8083

spring:
  application:
    name: dts-ingestion
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dts-pg:5432/dtsPlatform}
    username: ${SPRING_DATASOURCE_USERNAME:dts}
    password: ${SPRING_DATASOURCE_PASSWORD:dts}
  liquibase:
    change-log: classpath:config/liquibase/master.xml
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - health
          - info

dts:
  ingestion:
    enabled: true
    trusted-service-name: ${DTS_INGESTION_TRUSTED_SERVICE_NAME:dts-platform}
  addax:
    enabled: ${DTS_ADDAX_ENABLED:true}
    job-dir: ${DTS_ADDAX_JOB_DIR:/opt/prod/s10/dts-stack/services/dts-addax/jobs}
    image: ${IMAGE_ADDAX:wgzhao/addax:0.59.1}
    dag-id: ${DTS_ADDAX_DAG_ID:addax_job}
  airflow:
    enabled: ${DTS_AIRFLOW_ENABLED:true}
    base-url: ${DTS_AIRFLOW_BASE_URL:http://dts-airflow-webserver:8080}
    api-path: ${DTS_AIRFLOW_API_PATH:/api/v1}
    username: ${DTS_AIRFLOW_USERNAME:}
    password: ${DTS_AIRFLOW_PASSWORD:}
    dag-id: ${DTS_AIRFLOW_DAG_ID:dbt_load}
  openmetadata:
    enabled: ${DTS_OPENMETADATA_ENABLED:${DTS_PLATFORM_OPENMETADATA_ENABLED:true}}
    base-url: ${DTS_OPENMETADATA_BASE_URL:${DTS_PLATFORM_OPENMETADATA_BASE_URL:http://dts-openmetadata:8585}}
    api-path: ${DTS_OPENMETADATA_API_PATH:/api/v1}
    auth-token: ${DTS_OPENMETADATA_AUTH_TOKEN:${DTS_PLATFORM_OPENMETADATA_AUTH_TOKEN:}}
    table-fields: ${DTS_OPENMETADATA_TABLE_FIELDS:${DTS_PLATFORM_OPENMETADATA_TABLE_FIELDS:columns,owner,tags,domain}}
    source-service-name: ${DTS_OPENMETADATA_SOURCE_SERVICE_NAME:}
    source-service-type: ${DTS_OPENMETADATA_SOURCE_SERVICE_TYPE:}
    destination-service-name: ${DTS_OPENMETADATA_DESTINATION_SERVICE_NAME:${DTS_PLATFORM_OPENMETADATA_SERVICE_NAME:}}
    destination-service-type: ${DTS_OPENMETADATA_DESTINATION_SERVICE_TYPE:Postgres}
    destination-database: ${DTS_OPENMETADATA_DESTINATION_DATABASE:${DTS_PLATFORM_OPENMETADATA_DEFAULT_DATABASE:}}
    destination-schema: ${DTS_OPENMETADATA_DESTINATION_SCHEMA:${DTS_PLATFORM_OPENMETADATA_DEFAULT_SCHEMA:}}
    source-database: ${DTS_OPENMETADATA_SOURCE_DATABASE:}
    source-schema: ${DTS_OPENMETADATA_SOURCE_SCHEMA:}
    ingestion-enabled: ${DTS_OPENMETADATA_INGESTION_ENABLED:true}
    ingestion-pipeline-prefix: ${DTS_OPENMETADATA_INGESTION_PREFIX:dts_ingest}
    ingestion-default-schedule: ${DTS_OPENMETADATA_INGESTION_SCHEDULE:0 * * * *}
  platform:
    infra:
      encryption-key: ${DTS_INFRA_ENCRYPTION_KEY:}
      key-version: ${DTS_INFRA_KEY_VERSION:v1}
