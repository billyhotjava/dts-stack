spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON\;CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  liquibase:
    enabled: false

dts:
  ingestion:
    enabled: true
  addax:
    enabled: true
    job-dir: /tmp/addax-jobs
    image: quay.io/wgzhao/addax:6.0.8
  airflow:
    enabled: false
    base-url: http://localhost:8080
  openmetadata:
    enabled: false
