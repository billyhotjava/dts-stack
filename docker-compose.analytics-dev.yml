## Dev overlay: Analytics (Metabase) from source with UI hot reload.
##
## Usage (local dev mode):
##   ./dev-up.sh --mode local --analytics-dev
##
## Notes:
## - `/analytics` is served by the backend (Jetty) so it can inject the correct base paths and handle OIDC callbacks.
## - UI bundles are served by rspack dev server under `/analytics-dev-assets`, enabling hot reload.
##
## Requirement:
## - Build the dev image once (needs network): `docker build -t dts-analytics-dev:local -f services/dts-analytics-dev/Dockerfile .`

services:
  dts-analytics-dev:
    # Prefer unified var name; keep IMAGE_ANALYTICS_DEV for backward compatibility.
    image: ${IMAGE_DTS_ANALYTICS_DEV:-${IMAGE_ANALYTICS_DEV:-dts-analytics-dev:local}}
    working_dir: /workspace
    depends_on:
      dts-pg:
        condition: service_healthy
    environment:
      # IMPORTANT: in dev mode Metabase defaults to binding on localhost, which Traefik cannot reach.
      # Bind on all interfaces inside the container.
      MB_JETTY_HOST: "0.0.0.0"
      MB_JETTY_PORT: "3000"
      MB_DB_CONNECTION_URI: postgres://${PG_USER_METABASE:-metabase}:${PG_PWD_METABASE:-metabase}@${PG_HOST:-dts-pg}:${PG_PORT:-5432}/${PG_DB_METABASE:-metabase}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET:-}
      MB_SITE_URL: "${METABASE_SITE_URL:-https://${HOST_PLATFORM_UI}/analytics}"
      MB_PLUGINS_DIR: /plugins
      MB_LOG_FILE: /var/log/metabase/metabase.log
      MB_OIDC_CLIENT_ID: ${METABASE_OIDC_CLIENT_ID:-}
      MB_OIDC_CLIENT_SECRET: ${METABASE_OIDC_CLIENT_SECRET:-}
      MB_OIDC_REDIRECT_URI: ${METABASE_OIDC_REDIRECT_URI:-}
      MB_OIDC_METADATA_URL: ${METABASE_OIDC_METADATA_URL:-}

      MB_FRONTEND_DEV_PORT: "8080"
      MB_FRONTEND_DEV_PUBLIC_URL: "https://${HOST_PLATFORM_UI}/analytics-dev-assets/"
      MB_TEST_CUSTOM_DOMAINS: "${HOST_PLATFORM_UI}"

      NODE_OPTIONS: "--max-old-space-size=8192"

      # Pass through proxy envs when available (useful in restricted/offline environments).
      #
      # NOTE: If the host sets e.g. https_proxy=http://127.0.0.1:10808, that address is
      # *inside the container* and will fail with "Connection refused" unless a proxy is
      # running in the container. The command below rewrites 127.0.0.1 -> host.docker.internal
      # (see extra_hosts) so containers can reach a host-side proxy.
      DTS_DEV_PROXY_REWRITE_LOCALHOST: "${DTS_DEV_PROXY_REWRITE_LOCALHOST:-true}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    command:
      - bash
      - -lc
      - /patches/analytics-dev-entrypoint.sh
    volumes:
      - ./source/dts-bi-analytics:/workspace:Z
      - ./services/dts-analytics-dev/analytics-dev-entrypoint.sh:/patches/analytics-dev-entrypoint.sh:ro,Z
      - ./services/dts-analytics/plugins:/plugins:Z
      - ./services/dts-analytics/logs:/var/log/metabase:Z
      - ./services/certs:/certs:ro,z
      # Persist dependency caches across restarts (avoids repeated downloads).
      - analytics-dev-m2:/root/.m2
      - analytics-dev-gitlibs:/root/.gitlibs
      - analytics-dev-yarn-cache:/root/.cache/yarn
    restart: unless-stopped
    networks:
      - dts-core
    # Allow containers to reach host services (e.g. host-side HTTP proxy) via host.docker.internal.
    # Works on ultra-low Docker versions (no 'host-gateway' keyword) by using a configurable IP.
    extra_hosts:
      - "host.docker.internal:${DOCKER_HOST_GATEWAY_IP:-${HOST_GATEWAY_IP:-172.17.0.1}}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dts-core"

      # Same-domain mount: https://${HOST_PLATFORM_UI}/analytics -> backend (Jetty)
      - "traefik.http.routers.dts-analytics-dev-path.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/analytics`)"
      - "traefik.http.routers.dts-analytics-dev-path.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics-dev-path.tls=true"
      - "traefik.http.routers.dts-analytics-dev-path.priority=180"
      - "traefik.http.routers.dts-analytics-dev-path.service=dts-analytics-dev"
      - "traefik.http.services.dts-analytics-dev.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.analytics-dev-strip-analytics.stripprefixregex.regex=/analytics"
      - "traefik.http.middlewares.analytics-dev-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/analytics"
      - "traefik.http.routers.dts-analytics-dev-path.middlewares=analytics-dev-strip-analytics@docker,analytics-dev-prefix@docker,security-headers@file"

      # Hot-reload assets: https://${HOST_PLATFORM_UI}/analytics-dev-assets/* -> rspack dev server
      - "traefik.http.routers.dts-analytics-dev-assets.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/analytics-dev-assets`)"
      - "traefik.http.routers.dts-analytics-dev-assets.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics-dev-assets.tls=true"
      - "traefik.http.routers.dts-analytics-dev-assets.priority=300"
      - "traefik.http.routers.dts-analytics-dev-assets.service=dts-analytics-dev-assets"
      - "traefik.http.services.dts-analytics-dev-assets.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.analytics-dev-strip-assets.stripprefixregex.regex=/analytics-dev-assets"
      - "traefik.http.routers.dts-analytics-dev-assets.middlewares=analytics-dev-strip-assets@docker,security-headers@file"

volumes:
  analytics-dev-m2:
  analytics-dev-gitlibs:
  analytics-dev-yarn-cache:
