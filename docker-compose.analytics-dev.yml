## Dev overlay for analytics: run dts-analytics + dts-analytics-webapp from source via bind mounts.
## Used by: ./dev-up.sh --mode local (default) or ./dev-up.sh --mode local --analytics-dev

services:
  dts-analytics:
    image: ${IMAGE_MAVEN}
    working_dir: /workspace-src/dts-analytics
    depends_on:
      dts-pg:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${ANALYTICS_JAVA_TOOL_OPTIONS:-}
      SPRING_DATASOURCE_URL: ${ANALYTICS_DB_URL:-jdbc:postgresql://dts-pg:5432/dts_analytics}
      SPRING_DATASOURCE_USERNAME: ${ANALYTICS_DB_USER:-dts_analytics}
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-dts_analytics}
    command:
      - bash
      - -lc
      - |
        mvn -q -DskipTests package || true
        mvn -q -DskipTests spring-boot:run \
          -Dspring-boot.run.arguments="--spring.datasource.url=$${SPRING_DATASOURCE_URL} --spring.datasource.username=$${SPRING_DATASOURCE_USERNAME} --spring.datasource.password=$${SPRING_DATASOURCE_PASSWORD}"
    ports:
      - "127.0.0.1:${ANALYTICS_HOST_PORT:-3000}:3000"
    volumes:
      - ./source:/workspace-src:z
      - ./services/dts-analytics/plugins:/plugins:Z
      - ./services/dts-analytics/data:/data:Z
      - ./services/dts-analytics/logs:/var/log/dts-analytics:Z
      - ./services/certs:/certs:ro,z
      - maven-cache:/root/.m2
    networks:
      - dts-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dts-core"
      - "traefik.http.routers.dts-analytics.rule=Host(`${HOST_ANALYTICS}`)"
      - "traefik.http.routers.dts-analytics.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics.tls=true"
      - "traefik.http.routers.dts-analytics.middlewares=security-headers@file"
      - "traefik.http.services.dts-analytics.loadbalancer.server.port=3000"
      - "traefik.http.routers.dts-analytics-api.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/analytics/api`)"
      - "traefik.http.routers.dts-analytics-api.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics-api.tls=true"
      - "traefik.http.routers.dts-analytics-api.priority=11000"
      - "traefik.http.routers.dts-analytics-api.service=dts-analytics"
      - "traefik.http.middlewares.analytics-strip-analytics.stripprefixregex.regex=/analytics"
      - "traefik.http.middlewares.analytics-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/analytics"
      - "traefik.http.routers.dts-analytics-api.middlewares=analytics-strip-analytics@docker,analytics-prefix@docker,cors-allow@file,security-headers@file"

  dts-analytics-webapp:
    image: node:22-bookworm-slim
    working_dir: /workspace
    depends_on:
      dts-analytics:
        condition: service_healthy
    environment:
      PORT: "3001"
      DTS_ANALYTICS_API_BASE: http://dts-analytics:3000
      DTS_ANALYTICS_WEBAPP_LEGACY_DIR: /workspace/legacy/frontend_client
    command: ["sh","-lc","node server.mjs"]
    ports:
      - "127.0.0.1:${ANALYTICS_WEBAPP_HOST_PORT:-3001}:3001"
    volumes:
      - ./source/dts-analytics-webapp:/workspace:z
    networks:
      - dts-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3001/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dts-core"
      - "traefik.http.routers.dts-analytics-ui.rule=Host(`${HOST_PLATFORM_UI}`) && PathPrefix(`/analytics`)"
      - "traefik.http.routers.dts-analytics-ui.entrypoints=websecure"
      - "traefik.http.routers.dts-analytics-ui.tls=true"
      - "traefik.http.routers.dts-analytics-ui.priority=10000"
      - "traefik.http.services.dts-analytics-webapp.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.analytics-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/analytics"
      - "traefik.http.routers.dts-analytics-ui.middlewares=analytics-prefix@docker,security-headers@file"
